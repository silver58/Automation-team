<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  // Apply user color override on every page load, before paint.
  try {
    const saved = localStorage.getItem('salcomp_amb_color');
    if(saved){
      const c = JSON.parse(saved);
      const r = document.documentElement;
      r.style.setProperty('--amb', c.amb);
      r.style.setProperty('--amb-rgb', c.rgb);
      r.style.setProperty('--amb-hover', c.hover);
      r.style.setProperty('--amb-deep', c.deep);
      r.style.setProperty('--amb-light', c.light);
      r.style.setProperty('--amb2', c.amb2);
    }
  } catch(e){ /* ignore */ }
})();
</script>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="salcomp-logo.png">
<link rel="apple-touch-icon" href="salcomp-logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d90f27">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salcomp — Analytics Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root{
  --bg:#0d1117;--sur:#161b22;--sur2:#1c2128;--bdr:#21262d;--bdr2:#30363d;
  --amb:#f0a500;--amb-rgb:240,165,0;--amb-hover:#d59300;--amb-deep:#b07000;--amb-light:#fff5dc;--amb2:#ffd166;--grn:#3fb950;--red:#f85149;
  --yel:#e3b341;--blu:#388bfd;--pur:#a371f7;--cyn:#39c5cf;
  --txt:#e6edf3;--mut:#d0d7de;--mut2:#b1bac4;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-text-size-adjust:100%;}
input,select,textarea{font-size:16px !important;}
@media(min-width:861px){input,select,textarea{font-size:13px !important;}}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.site-header{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.site-header a.back{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--bdr2);color:var(--mut);font-size:11px;font-family:'IBM Plex Mono',monospace;padding:5px 11px;border-radius:6px;cursor:pointer;text-decoration:none;transition:all .15s;flex-shrink:0;}
.site-header a.back:hover{border-color:var(--amb);color:var(--amb);}
.logo{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--amb);letter-spacing:.08em;text-transform:uppercase;}
.hdr-right{display:flex;gap:14px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);}
.live-dot{display:inline-flex;align-items:center;gap:6px;}
.live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── MAIN ────────────────────────────────────────────────────────────────── */
.main{max-width:1200px;margin:0 auto;padding:24px 28px 60px;}
.page-title{font-size:22px;font-weight:600;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--mut);margin-bottom:20px;}

/* ── DATE RANGE PILLS ─────────────────────────────────────────────────────── */
.range-row{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
.range-pills{display:inline-flex;gap:4px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:4px;}

/* CUSTOM DATE RANGE */
.custom-range{display:inline-flex;align-items:center;gap:6px;background:var(--sur);border:1px solid var(--amb);border-radius:8px;padding:4px 6px;}
.custom-date-input{background:var(--bg);border:1px solid var(--bdr2);border-radius:5px;padding:5px 8px;color:var(--txt);font-family:'IBM Plex Mono',monospace;font-size:11px;outline:none;}
.custom-date-input:focus{border-color:var(--amb);}
.custom-range-sep{font-family:'IBM Plex Mono',monospace;color:var(--mut);font-size:11px;}
.custom-range-apply{background:var(--amb);color:#000;border:none;padding:5px 11px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;}
.custom-range-apply:hover{background:var(--amb-hover);}

/* TYPE FILTER PILLS */
.type-filter-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.type-filter-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut2);}
.type-pills{display:inline-flex;gap:4px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:4px;flex-wrap:wrap;}
.tpill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:5px;border:none;background:transparent;color:var(--mut);font-size:12px;font-family:'IBM Plex Sans',sans-serif;font-weight:500;cursor:pointer;transition:all .15s;}
.tpill:hover{color:var(--txt);}
.tpill.active{background:rgba(var(--amb-rgb), .14);color:var(--amb);}
.tpill-count{background:var(--bdr2);color:var(--mut);font-size:10.5px;font-family:'IBM Plex Mono',monospace;padding:1px 7px;border-radius:9px;font-weight:600;min-width:22px;text-align:center;}
.tpill.active .tpill-count{background:rgba(var(--amb-rgb), .28);color:var(--amb);}
.rpill{padding:6px 16px;border-radius:5px;border:none;background:transparent;color:var(--mut);font-size:12px;font-family:'IBM Plex Mono',monospace;font-weight:500;cursor:pointer;transition:all .15s;}
.rpill:hover{color:var(--txt);}
.rpill.active{background:rgba(var(--amb-rgb), .12);color:var(--amb);}
.range-meta{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--mut2);}
.refresh-btn{background:transparent;border:1px solid var(--bdr2);color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .15s;margin-left:auto;}
.refresh-btn:hover{border-color:var(--amb);color:var(--amb);}

.layout-toggle-btn{
  background:transparent;border:1px solid var(--bdr2);color:var(--mut);
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .15s;
  font-weight:600;letter-spacing:.04em;
}
.layout-toggle-btn:hover{border-color:var(--amb);color:var(--amb);background:rgba(var(--amb-rgb),.06);}

/* ── LOADING ──────────────────────────────────────────────────────────────── */
.loading{padding:60px 20px;text-align:center;color:var(--mut);font-size:14px;}
.loading .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--bdr2);border-top-color:var(--amb);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── KPI STRIP ────────────────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:22px;background:var(--bdr);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;}
.kpi{background:var(--sur);padding:14px 18px;position:relative;overflow:hidden;cursor:default;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;}
.kpi.k-blu::before{background:var(--blu);}
.kpi.k-grn::before{background:var(--grn);}
.kpi.k-amb::before{background:var(--amb);}
.kpi.k-red::before{background:var(--red);}
.kpi-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);margin-bottom:5px;}
.kpi-val{font-size:24px;font-weight:600;line-height:1;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em;}
.kpi.k-blu .kpi-val{color:var(--blu);}
.kpi.k-grn .kpi-val{color:var(--grn);}
.kpi.k-amb .kpi-val{color:var(--amb);}
.kpi.k-red .kpi-val{color:var(--red);}

/* Make KPIs clickable with race-up animation */
.kpi{cursor:pointer;transition:transform .15s, box-shadow .15s, border-color .2s;position:relative;overflow:hidden;}
.kpi:hover{transform:translateY(-2px);}
.kpi:active{transform:translateY(0);}
.kpi-racing{
  border-color:currentColor !important;
}
.kpi-racing::after{
  /* Sweeping shimmer that travels across the card during the count */
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%);
  transform:translateX(-100%);
  animation:kpiRaceShine .9s cubic-bezier(.4,0,.2,1) forwards;
}
.kpi-racing .kpi-val{
  /* Subtle pulse to draw attention while counting */
  animation:kpiRaceGlow .9s ease-out forwards;
}
@keyframes kpiRaceShine{
  to{transform:translateX(100%);}
}
@keyframes kpiRaceGlow{
  0%   {text-shadow:0 0 0 currentColor; transform:scale(1);}
  40%  {text-shadow:0 0 18px currentColor; transform:scale(1.04);}
  100% {text-shadow:0 0 0 currentColor; transform:scale(1);}
}
.kpi-sub{font-size:10.5px;color:var(--mut);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
.delta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.02em;}
.delta-good{color:var(--grn);}
.delta-bad{color:var(--red);}
.delta-flat{color:var(--mut2);}
.delta-up{color:var(--grn);}
.delta-down{color:var(--red);}

/* AUTO-REFRESH BADGE */
.refresh-status{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut2);margin-left:auto;}
.refresh-status .live-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 6px var(--grn);animation:livePulse 2s infinite;}
@keyframes livePulse{0%,100%{opacity:.5;}50%{opacity:1;}}

/* CSV EXPORT BUTTON */
.csv-btn{background:transparent;border:1px solid var(--bdr2);color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 10px;border-radius:5px;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.csv-btn:hover{border-color:var(--amb);color:var(--amb);}

/* DRILL-DOWN BADGE */
.drill-active{background:rgba(var(--amb-rgb), .12);border:1px solid var(--amb);border-radius:8px;padding:8px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.drill-active-text{color:var(--amb);font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;}
.drill-active-clear{background:transparent;border:1px solid var(--bdr2);color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 10px;border-radius:5px;cursor:pointer;}
.drill-active-clear:hover{border-color:var(--red);color:var(--red);}

/* GOAL LINE on production chart */
.goal-line{stroke:var(--amb);stroke-width:1;stroke-dasharray:4,3;opacity:.5;}
.goal-label{fill:var(--amb);font-family:'IBM Plex Mono',monospace;font-size:9px;}

/* DOWNTIME HEATMAP */
.dt-heatmap{display:grid;grid-template-columns:auto repeat(24,1fr);gap:2px;font-family:'IBM Plex Mono',monospace;font-size:9px;margin-top:14px;}
.dt-heatmap-lbl{color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.dt-heatmap-cell{aspect-ratio:1;background:var(--bg);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--mut2);font-size:9.5px;cursor:default;transition:transform .12s;position:relative;}
.dt-heatmap-cell:hover{transform:scale(1.15);z-index:2;}
.dt-heatmap-cell[data-tooltip]:hover::after{
  content:attr(data-tooltip);
  position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:var(--sur2);border:1px solid var(--bdr2);border-radius:5px;
  padding:5px 9px;font-size:11px;color:var(--txt);white-space:nowrap;pointer-events:none;
  font-family:'IBM Plex Sans',sans-serif;
}
.dt-heatmap-hour-row{display:contents;}
.dt-heatmap-hours{display:grid;grid-template-columns:auto repeat(24,1fr);gap:2px;margin-bottom:4px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--mut2);}
.dt-heatmap-hours div{text-align:center;}

/* FLAG AGE BADGES */
.flag-age{display:inline-block;padding:1px 6px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-left:6px;vertical-align:middle;}
.flag-age-new{background:rgba(63,185,80,.15);color:var(--grn);}
.flag-age-recent{background:rgba(var(--amb-rgb), .15);color:var(--amb);}
.flag-age-stale{background:rgba(255,138,60,.15);color:#ff8a3c;}
.flag-age-critical{background:rgba(248,81,73,.15);color:var(--red);animation:critFlash 2s infinite;}
@keyframes critFlash{0%,100%{opacity:1;}50%{opacity:.6;}}

/* CLICKABLE BAR HINT */
svg .bar-clickable{cursor:pointer;transition:opacity .12s;}
svg .bar-clickable:hover{opacity:.7;}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr);}}

/* ── PANELS ──────────────────────────────────────────────────────────────── */
.panel{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;margin-bottom:18px;overflow:hidden;}
.panel-head{padding:13px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;transition:background .15s;position:relative;}
.panel-head:hover{background:rgba(255,255,255,.02);}
.panel-head h2{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);}

/* Panel headings double as links to dedicated detail pages */
.panel-head-link{
  color:inherit;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:color .15s;
  cursor:pointer;
}
.panel-head-link:hover{color:var(--amb);}
.panel-head-arrow{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  color:var(--mut2);
  transition:transform .2s, color .15s;
  margin-left:2px;
}
.panel-head-link:hover .panel-head-arrow{
  color:var(--amb);
  transform:translateX(3px);
}
.panel-head .panel-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut2);}
/* Collapse caret on the left of the title */
.panel-head h2::before{
  content:'▾';
  display:inline-block;
  margin-right:8px;
  color:var(--mut2);
  font-size:9px;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  vertical-align:middle;
}
.panel.collapsed .panel-head{border-bottom-color:transparent;}
.panel.collapsed .panel-head h2::before{transform:rotate(-90deg);}
.panel.collapsed .panel-body{
  max-height:0;
  padding-top:0;
  padding-bottom:0;
  opacity:0;
  overflow:hidden;
  pointer-events:none;
}
.panel-body{padding:18px 20px;max-height:5000px;opacity:1;transition:max-height .35s cubic-bezier(.4,0,.2,1), opacity .25s, padding .25s;}

/* legend strip used in chart panels */
.legend-strip{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.lkey{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-family:'IBM Plex Mono',monospace;}
.lkey .dot{width:9px;height:9px;border-radius:2px;}
.lkey.pott .dot{background:var(--grn);}
.lkey.wav  .dot{background:var(--blu);}
.lkey.car  .dot{background:var(--pur);}

/* ── CHART CONTAINERS ────────────────────────────────────────────────────── */
.chart-wrap{position:relative;width:100%;height:240px;}
.chart-wrap svg{display:block;width:100%;height:100%;font-family:'IBM Plex Mono',monospace;}

.empty{padding:40px 20px;text-align:center;color:var(--mut2);font-size:13px;}
.empty-icon{font-size:30px;margin-bottom:10px;opacity:.5;}

/* ── DOWNTIME 2-UP ────────────────────────────────────────────────────────── */
.dt-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.dt-causes{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:14px;max-height:260px;overflow-y:auto;}

/* ═══ TIER SECTIONS ════════════════════════════════════════════════════ */
.tier-section{margin-bottom:8px;}
.tier-section + .tier-section{margin-top:24px;}
.tier-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:var(--mut2);
  padding:0 4px 8px;
  border-bottom:1px solid var(--bdr);
  margin-bottom:14px;
  display:flex;align-items:baseline;gap:8px;
}
.tier-section.tier-pinned .tier-label{color:var(--amb);border-bottom-color:rgba(var(--amb-rgb),.3);}

/* Pin button on each panel head */
.pin-btn{
  background:transparent;border:none;
  color:var(--mut2);
  font-size:14px;
  cursor:pointer;
  padding:2px 7px;
  border-radius:4px;
  margin-left:4px;
  transition:color .15s, transform .15s;
  flex-shrink:0;
}
.pin-btn:hover{color:var(--amb);transform:scale(1.15);}
.pin-btn.pin-on{color:var(--amb);}

/* ═══ OEE SUMMARY PANEL ═══════════════════════════════════════════════ */
.oee-uph-row{
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:7px;
  padding:11px 14px;
  margin-bottom:12px;
}
.oee-uph-row-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  font-weight:600;
  color:var(--mut);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:10px;
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.oee-uph-hint{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  color:var(--mut2);
  font-style:italic;
  font-weight:400;
  text-transform:none;
  letter-spacing:0;
}
.oee-uph-grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:8px;
}
@media(max-width:560px){
  .oee-uph-grid{grid-template-columns:repeat(3, 1fr);}
}
.oee-uph-cell{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.oee-uph-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  color:var(--mut2);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.oee-uph-input{
  background:var(--sur);
  border:1px solid var(--bdr2);
  border-radius:5px;
  padding:6px 8px;
  color:var(--amb);
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  font-weight:600;
  width:100%;
  outline:none;
  transition:border-color .15s;
}
.oee-uph-input:focus{border-color:var(--amb);}
.oee-strip{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
@media(max-width:760px){.oee-strip{grid-template-columns:1fr 1fr;}}
@media(max-width:420px){.oee-strip{grid-template-columns:1fr;}}
.oee-card{
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:8px;
  padding:14px 16px;
}
.oee-card.oee-headline{
  background:linear-gradient(135deg, rgba(var(--amb-rgb),.05), rgba(var(--amb-rgb),.02));
  border-color:rgba(var(--amb-rgb),.2);
}
.oee-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.oee-big{font-family:'IBM Plex Mono',monospace;font-size:36px;font-weight:600;line-height:1;letter-spacing:-.02em;}
.oee-num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;line-height:1;color:var(--txt);}
.oee-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);margin-top:6px;}
.oee-formula{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amb);margin-top:6px;letter-spacing:.06em;}
.oee-area-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
  gap:8px;
  margin-bottom:12px;
}
.oee-area-card{
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:6px;
  padding:10px 12px;
}
.oee-area-name{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.oee-area-oee{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1;margin:4px 0;}
.oee-area-bd{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut);display:flex;gap:8px;}
.oee-area-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mut2);margin-top:4px;}
.oee-formula-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);background:var(--bg);border:1px solid var(--bdr);border-radius:5px;padding:8px 11px;line-height:1.5;}
.oee-formula-note strong{color:var(--mut);}

/* ═══ PARETO PANEL ═══════════════════════════════════════════════════════ */
.pareto-header,
.pareto-row{
  display:grid;
  grid-template-columns:32px 1fr 130px 60px 50px;
  gap:10px;
  align-items:center;
  padding:7px 10px;
  font-size:11.5px;
}
.pareto-header{
  background:var(--bg);
  border-radius:6px 6px 0 0;
  border:1px solid var(--bdr);
  border-bottom:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--mut2);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.pareto-list{border:1px solid var(--bdr);border-radius:0 0 6px 6px;background:var(--sur2);}
.pareto-row{border-bottom:1px solid var(--bdr);transition:background .15s;}
.pareto-row:last-child{border-bottom:none;}
.pareto-row:hover{background:rgba(var(--amb-rgb),.04);}
.pareto-vital{background:rgba(var(--amb-rgb),.06);}
.pareto-vital:hover{background:rgba(var(--amb-rgb),.1);}
.pareto-rank{font-family:'IBM Plex Mono',monospace;color:var(--mut2);text-align:center;font-weight:600;}
.pareto-vital .pareto-rank{color:var(--amb);}
.pareto-label{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--txt);}
.pareto-type{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:9px;}
.pareto-meta{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mut2);margin-left:4px;}
.pareto-bar{height:8px;background:var(--bg);border:1px solid var(--bdr);border-radius:4px;overflow:hidden;}
.pareto-bar-fill{height:100%;background:linear-gradient(90deg, var(--red), #ff8a3c);}
.pareto-vital .pareto-bar-fill{background:linear-gradient(90deg, var(--amb), #ff8a3c);}
.pareto-mins{font-family:'IBM Plex Mono',monospace;color:var(--red);font-weight:600;text-align:right;}
.pareto-vital .pareto-mins{color:var(--amb);}
.pareto-cum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);text-align:right;}
.pareto-footnote{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);margin-top:10px;font-style:italic;}

/* View toggle (☰ Table / 📊 Chart) sits in panel head */
.pareto-view-toggle{
  display:inline-flex;
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:6px;
  padding:2px;
  gap:1px;
}
.pview-btn{
  background:transparent;
  border:none;
  color:var(--mut2);
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  font-weight:500;
  padding:4px 10px;
  border-radius:4px;
  cursor:pointer;
  transition:all .15s;
  letter-spacing:.04em;
}
.pview-btn:hover{color:var(--txt);}
.pview-btn.active{
  background:rgba(var(--amb-rgb), .15);
  color:var(--amb);
  font-weight:600;
}

/* Chart view */
.pareto-chart-wrap{
  background:var(--sur2);
  border:1px solid var(--bdr);
  border-radius:7px;
  padding:14px 8px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.pareto-chart{
  width:100%;
  min-width:560px;
  height:auto;
  display:block;
}
.pareto-chart-legend{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  padding:10px 8px 0;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--mut);
}
.pareto-chart-legend span{display:inline-flex;align-items:center;gap:6px;}
.legend-sw{
  display:inline-block;
  width:14px;height:9px;
  border-radius:2px;
}
.legend-sw.legend-line{
  height:0;
  border-top:2px solid var(--cyn);
  border-radius:0;
  position:relative;
  width:18px;
}
.legend-sw.legend-line::before{
  content:'';
  position:absolute;
  top:-3px;left:6px;
  width:6px;height:6px;border-radius:50%;
  background:var(--cyn);
}
@media(max-width:560px){
  .pareto-header,.pareto-row{grid-template-columns:24px 1fr 50px 40px;font-size:10.5px;}
  .pareto-bar-h,.pareto-bar{display:none;}
}

/* ═══ CHANGEOVER PANEL ═══════════════════════════════════════════════ */
/* ═══ ALERT BANNERS ═══════════════════════════════════════════════════ */
.alert-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:14px;
}
.alert-row-empty{justify-content:flex-end;}
.alert-banner{
  flex:1;min-width:260px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:7px;
  font-size:13px;
  border:1px solid;
  background:rgba(248,81,73,.06);
  border-color:rgba(248,81,73,.3);
  color:var(--txt);
}
.alert-warn{background:rgba(248,81,73,.06);border-color:rgba(248,81,73,.3);}
.alert-icon{font-size:18px;flex-shrink:0;}
.alert-msg{flex:1;}
.alert-action{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--amb);text-decoration:none;
  padding:4px 10px;border:1px solid rgba(var(--amb-rgb),.4);
  border-radius:5px;flex-shrink:0;
  transition:all .15s;
}
.alert-action:hover{background:rgba(var(--amb-rgb),.1);border-color:var(--amb);}
.alert-cog{
  background:transparent;border:1px solid var(--bdr2);color:var(--mut2);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  padding:5px 11px;border-radius:5px;cursor:pointer;
  transition:all .15s;flex-shrink:0;
}
.alert-cog:hover{border-color:var(--amb);color:var(--amb);}

.co-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amb);background:rgba(var(--amb-rgb), .1);border:1px solid rgba(var(--amb-rgb), .25);padding:3px 9px;border-radius:5px;}

/* Material Change week-over-week trend badge */
.co-trend{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  font-weight:600;
  padding:3px 9px;
  border-radius:5px;
  border:1px solid;
}
.co-trend-up   {color:var(--red); background:rgba(248,81,73,.1);  border-color:rgba(248,81,73,.3);}
.co-trend-down {color:var(--grn); background:rgba(63,185,80,.1);  border-color:rgba(63,185,80,.3);}
.co-trend-flat {color:var(--mut); background:rgba(110,118,129,.1); border-color:rgba(110,118,129,.3);}
.co-spark{
  width:80px;height:22px;
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:5px;
  padding:2px 4px;
}
.co-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;}
@media(max-width:760px){.co-grid{grid-template-columns:1fr;}}
.co-areas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media(max-width:560px){.co-areas{grid-template-columns:1fr;}}
.co-area{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:11px 12px;}
.co-area-hd{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt);font-weight:600;letter-spacing:.04em;}
.co-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.co-area-rate{margin-left:auto;color:var(--amb);font-size:13px;font-weight:600;}
.co-area-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);margin-top:4px;}
.co-empty{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut2);font-style:italic;}
.co-items{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
.co-item{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;font-size:11px;}
.co-item-name{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.co-item-bar{height:5px;background:var(--bg);border:1px solid var(--bdr);border-radius:3px;overflow:hidden;position:relative;}
.co-item-fill{display:block;height:100%;background:linear-gradient(90deg, var(--amb), #ff8a3c);}
.co-item-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amb);font-weight:600;}

.co-recent{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:11px 12px;}
.co-recent-hd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt);font-weight:600;letter-spacing:.04em;margin-bottom:8px;}
.co-recent-list{display:flex;flex-direction:column;gap:8px;max-height:250px;overflow-y:auto;}
.co-recent-row{display:grid;grid-template-columns:60px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bdr);}
.co-recent-row:last-child{border-bottom:none;}
.co-recent-when{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);}
.co-recent-where{font-size:11.5px;color:var(--txt);}
.co-recent-tech{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut);margin-top:2px;}

/* ═══ SHIFT PARTICIPATION PANEL ══════════════════════════════════════ */
.shift-overall{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:5px;}
.shift-overall-good{color:var(--grn);background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.25);}
.shift-overall-mid {color:var(--amb);background:rgba(var(--amb-rgb),.1);border:1px solid rgba(var(--amb-rgb),.25);}
.shift-overall-low {color:var(--red);background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.25);}
.shift-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:10px;}
.shift-card{
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:8px;
  padding:13px 14px;
  display:flex;flex-direction:column;gap:7px;
  position:relative;overflow:hidden;
}
.shift-card.shift-good{border-left:3px solid var(--grn);}
.shift-card.shift-mid {border-left:3px solid var(--amb);}
.shift-card.shift-low {border-left:3px solid var(--red);}
.shift-card.shift-other{border-left:3px solid var(--mut2);opacity:.85;}
.shift-card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.shift-card-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.shift-card-hours{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mut2);letter-spacing:.04em;}
.shift-card-num{font-family:'IBM Plex Mono',monospace;line-height:1;display:baseline;}
.shift-card-cur{font-size:32px;font-weight:600;color:var(--txt);letter-spacing:-.02em;}
.shift-good .shift-card-cur{color:var(--grn);}
.shift-mid  .shift-card-cur{color:var(--amb);}
.shift-low  .shift-card-cur{color:var(--red);}
.shift-card-target{font-size:14px;color:var(--mut);margin-left:4px;}
.shift-card-bar{
  height:7px;background:var(--bg);
  border:1px solid var(--bdr);border-radius:4px;
  overflow:hidden;position:relative;
}
.shift-card-fill{height:100%;background:linear-gradient(90deg, var(--red), var(--amb), var(--grn));transition:width .4s ease;}
.shift-good .shift-card-fill{background:var(--grn);}
.shift-mid  .shift-card-fill{background:var(--amb);}
.shift-low  .shift-card-fill{background:var(--red);}
.shift-card-overflow{
  position:absolute;right:4px;top:-2px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  color:var(--grn);font-weight:600;
}
.shift-card-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);}
.shift-card-areas{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
.shift-area{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase;}
.shift-area-car {background:rgba(163,113,247,.15);color:#c89cff;}
.shift-area-pott{background:rgba(63,185,80,.15);color:var(--grn);}
.shift-area-wav {background:rgba(56,139,253,.15);color:#5fb1ff;}
.shift-area-bat {background:rgba(245,217,55,.15);color:#f5d937;}
.shift-area-iq9 {background:rgba(255,140,66,.15);color:#ff8c42;}
.shift-area-empty{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mut2);font-style:italic;}

/* Mech vs Production summary cards on downtime panel */
.dt-type-summary{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  gap:10px;
  margin-bottom:18px;
}
.dt-type-card{
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:8px;
  padding:12px 14px;
  position:relative;
}
.dt-type-card.dt-type-mech{border-left:3px solid var(--red);}
.dt-type-card.dt-type-prod{border-left:3px solid #5fb1ff;}
.dt-type-card.dt-type-unk {border-left:3px solid var(--mut2);}
.dt-type-lbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:4px;
}
.dt-type-val{
  font-family:'IBM Plex Mono',monospace;
  font-size:22px;font-weight:600;
  color:var(--txt);line-height:1;
}
.dt-type-card.dt-type-mech .dt-type-val{color:var(--red);}
.dt-type-card.dt-type-prod .dt-type-val{color:#5fb1ff;}
.dt-type-unit{font-size:11px;color:var(--mut2);font-weight:500;margin-left:3px;}
.dt-type-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);margin-top:6px;}

/* Type pill on top-causes list */
.dt-cause-txt .dt-pill{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;
  padding:1px 7px;
  border-radius:9px;
  margin-right:6px;
  vertical-align:middle;
}
.dt-cause-txt .dt-pill-mech{background:rgba(248,81,73,.15);color:var(--red);}
.dt-cause-txt .dt-pill-prod{background:rgba(95,177,255,.15);color:#5fb1ff;}
.dt-cause-txt .dt-pill-unk {background:rgba(110,118,129,.15);color:var(--mut2);}

/* Downtime panel local-range pills */
.dt-range-pills{display:inline-flex;background:var(--bg);border:1px solid var(--bdr2);border-radius:6px;padding:2px;}
.dt-range-pill{background:transparent;border:none;color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s;font-weight:500;}
.dt-range-pill:hover{color:var(--txt);}
.dt-range-pill.active{background:rgba(var(--amb-rgb), .15);color:var(--amb);}

/* Per-panel date-range pills (one set per card) */
.panel-range-pills{
  display:inline-flex;
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:6px;
  padding:2px;
  flex-shrink:0;
}
.panel-range-pill{
  background:transparent;border:none;
  color:var(--mut2);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:500;
  padding:3px 8px;
  border-radius:4px;
  cursor:pointer;
  transition:all .12s;
  letter-spacing:.02em;
}
.panel-range-pill:hover{color:var(--txt);}
.panel-range-pill.active{background:rgba(var(--amb-rgb), .12);color:var(--amb);font-weight:600;}

/* ═══ PM ACTIVITY PANEL ═════════════════════════════════════════════════ */
.pm-resolution-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--grn);background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.25);padding:3px 9px;border-radius:5px;}
.pm-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:760px){.pm-grid{grid-template-columns:1fr;}}
.pm-areas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media(max-width:560px){.pm-areas{grid-template-columns:1fr;}}
.pm-area-card{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;}

/* ═══ MACHINE COVERAGE (PM + Scout) ═══════════════════════════════════ */
.pm-cov-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  font-weight:600;
  padding:3px 9px;
  border-radius:5px;
  border:1px solid;
}
.pm-cov-badge-good{color:var(--grn); background:rgba(63,185,80,.1);  border-color:rgba(63,185,80,.3);}
.pm-cov-badge-mid {color:var(--amb); background:rgba(var(--amb-rgb),.1); border-color:rgba(var(--amb-rgb),.3);}
.pm-cov-badge-low {color:var(--red); background:rgba(248,81,73,.1); border-color:rgba(248,81,73,.3);}

.pm-coverage, .scout-coverage{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:6px 0;
}
.pm-cov-bar{
  height:5px;
  background:rgba(255,255,255,.05);
  border-radius:3px;
  overflow:hidden;
}
.pm-cov-fill{
  height:100%;
  transition:width .4s ease;
}
.pm-cov-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
}
.pm-cov-pct{font-weight:600;}
.pm-cov-meta{color:var(--mut2);}
.pm-cov-missing{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:2px;
}
.pm-cov-missing-lbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  color:var(--mut2);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-right:4px;
}
.pm-cov-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  font-weight:600;
  padding:2px 6px;
  border-radius:9px;
  letter-spacing:.02em;
}
.pm-cov-chip-done{
  background:rgba(63,185,80,.12);
  color:var(--grn);
  border:1px solid rgba(63,185,80,.25);
}
.pm-cov-chip-missing{
  background:rgba(248,81,73,.1);
  color:var(--red);
  border:1px solid rgba(248,81,73,.25);
}
/* In scout cards (anchor tags) the coverage row needs slight spacing */
.scout-card .scout-coverage{
  width:100%;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--bdr);
}
.pm-area-card.pm-empty{justify-content:center;align-items:flex-start;min-height:140px;}
.pm-empty-text{color:var(--mut2);font-size:11px;font-style:italic;}
.pm-area-hd{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt);font-weight:600;letter-spacing:.04em;}
.pm-area-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.pm-area-count{margin-left:auto;color:var(--mut);font-size:10px;font-weight:500;}
.pm-bar{display:flex;height:9px;background:var(--bg);border-radius:5px;overflow:hidden;border:1px solid var(--bdr);}
.pm-bar-tall{height:24px;}
.pm-bar-seg{height:100%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#fff;font-weight:600;transition:width .3s ease;}
.pm-seg-ok  {background:linear-gradient(90deg, #2da44e, #3fb950);}
.pm-seg-attn{background:linear-gradient(90deg, #d29922, #ff8a3c);}
.pm-seg-na  {background:linear-gradient(90deg, #545d6a, #6e7681);}
.pm-bar-legend{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;}
.pm-leg-ok{color:var(--grn);}
.pm-leg-attn{color:#ff8a3c;}
.pm-leg-na{color:var(--mut2);}
.pm-meta-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:6px;border-top:1px solid var(--bdr);}
.pm-meta-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;}
.pm-meta-val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--txt);font-weight:600;margin-top:2px;}
.pm-meta-val-sm{font-size:11px;font-weight:500;}
.pm-meta-sub{font-size:9.5px;color:var(--mut);font-weight:400;margin-left:4px;}

.pm-attn-block{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;}
.pm-attn-hd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt);font-weight:600;letter-spacing:.04em;}
.pm-attn-sub{font-size:10px;color:var(--mut2);margin-bottom:4px;}
.pm-attn-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;}
.pm-attn-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bdr);align-items:baseline;}
.pm-attn-row:last-child{border-bottom:none;}
.pm-attn-text{font-size:11.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pm-attn-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--red);font-weight:600;}

.pm-overall-bar-wrap{margin-top:6px;}
.pm-overall-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.dt-cause-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--bdr);align-items:baseline;}
.dt-cause-row:last-child{border-bottom:none;}
.dt-cause-txt{font-size:12px;color:var(--txt);line-height:1.3;}
.dt-cause-mins{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--red);font-weight:600;white-space:nowrap;}
.dt-cause-meta{font-size:10px;color:var(--mut2);font-family:'IBM Plex Mono',monospace;margin-top:2px;}

/* ── SCOUT FLAGS ─────────────────────────────────────────────────────────── */
.scout-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:0;}
.scout-card{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:14px;transition:all .15s;cursor:pointer;text-decoration:none;color:var(--txt);display:block;}
.scout-card:hover{border-color:var(--bdr2);background:#181d24;transform:translateY(-1px);}
.scout-card-name{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.scout-card-num{font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
.scout-card.has-attn .scout-card-num{color:var(--red);}
.scout-card.clean .scout-card-num{color:var(--grn);}
.scout-card-meta{font-size:10.5px;color:var(--mut);margin-top:4px;font-family:'IBM Plex Mono',monospace;}

.flag-list{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:6px 14px;max-height:300px;overflow-y:auto;}
.flag-list-expanded{max-height:none;}
.flag-list-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut2);margin:14px 0 6px;letter-spacing:.02em;}
.scout-clear-btn{background:transparent;border:1px solid var(--amb);color:var(--amb);font-size:10.5px;font-family:'IBM Plex Mono',monospace;padding:4px 11px;border-radius:5px;cursor:pointer;transition:all .15s;}
.scout-clear-btn:hover{background:rgba(var(--amb-rgb), .1);}
.flags-review-btn{background:var(--amb);color:#000;font-size:10.5px;font-family:'IBM Plex Mono',monospace;font-weight:600;padding:5px 13px;border-radius:5px;text-decoration:none;letter-spacing:.04em;transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.flags-review-btn:hover{background:var(--amb2);}
.flag-row{padding:10px 0;border-bottom:1px solid var(--bdr);}
.flag-row:last-child{border-bottom:none;}
.flag-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap;}
.flag-source{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:3px;}
.flag-source.car{background:rgba(163,113,247,.12);color:var(--pur);}
.flag-source.wav{background:rgba(56,139,253,.12);color:var(--blu);}
.flag-source.pott{background:rgba(63,185,80,.12);color:var(--grn);}
.flag-when{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);}
.flag-section{font-size:11px;color:var(--mut);font-family:'IBM Plex Mono',monospace;margin-bottom:2px;}
.flag-item{font-size:12.5px;color:var(--txt);line-height:1.4;}
.flag-note{font-size:11.5px;color:var(--mut);font-style:italic;margin-top:4px;padding-left:10px;border-left:2px solid rgba(248,81,73,.3);}

/* ── REPORTS BY TECH ─────────────────────────────────────────────────────── */
.tech-list{padding:6px 0;}
.tech-row{
  display:grid;
  grid-template-columns:140px 1fr 50px;
  gap:14px;
  align-items:center;
  padding:8px 20px;
  border-bottom:1px solid var(--bdr);
  transition:background .12s;
}
.tech-row:last-child{border-bottom:none;}
.tech-row:hover{background:rgba(255,255,255,.02);}
.tech-row-active{background:rgba(var(--amb-rgb), .08) !important;border-left:2px solid var(--amb);}
.tech-extra{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mut);margin-top:2px;letter-spacing:.02em;}
.tech-name{
  font-size:13px;
  color:var(--txt);
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tech-bar-wrap{
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:4px;
  height:14px;
  overflow:hidden;
  cursor:default;
}
.tech-bar{
  display:flex;
  height:100%;
  transition:width .4s cubic-bezier(.4,0,.2,1);
}
.tech-seg{
  height:100%;
  transition:opacity .15s;
}
.tech-seg:hover{opacity:.75;}
.tech-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:15px;
  font-weight:600;
  color:var(--amb);
  text-align:right;
}
.tech-legend{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  padding:12px 20px;
  border-top:1px solid var(--bdr);
  background:rgba(0,0,0,.12);
}

/* ── WIP HEATMAP ─────────────────────────────────────────────────────────── */
.wip-line-pills{display:inline-flex;gap:3px;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;padding:3px;}
.wpill{padding:4px 11px;border-radius:4px;border:none;background:transparent;color:var(--mut);font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:500;cursor:pointer;transition:all .15s;}
.wpill:hover{color:var(--txt);}
.wpill.active{background:rgba(var(--amb-rgb), .14);color:var(--amb);}

.hgrid{display:flex;flex-direction:column;gap:2px;overflow-x:auto;}
.hrow{display:grid;grid-template-columns:80px 1fr;gap:4px;align-items:center;}
.hrow-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut);text-align:right;padding-right:4px;white-space:nowrap;}
.hrow-label-hdr{height:14px;}
.hrow-cells{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;min-width:480px;}
.hcell{height:22px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--txt);background:#1c2128;cursor:default;transition:transform .12s;}
.hcell:hover{transform:scale(1.15);outline:1px solid var(--amb);z-index:1;position:relative;}
.hcell-hdr{font-size:9px;color:var(--mut2);background:transparent;height:14px;}
.hcell-empty{background:#161b22;border:1px dashed var(--bdr);}

.wip-legend{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr);}
.wip-legend-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut2);}
.wip-legend-scale{display:flex;gap:1px;border-radius:3px;overflow:hidden;}
.wip-legend-cell{width:18px;height:12px;}
.wip-legend-meta{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut);}

/* WIP BUCKETS — compact 3-cell layout */
.wip-bucket-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.wip-bucket-card{background:var(--bg);border:1px solid var(--bdr);border-radius:6px;padding:7px 8px;text-align:center;transition:border-color .15s;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.wip-bucket-card:hover{border-color:var(--bdr2);}
.wip-bucket-card.empty-bucket{opacity:.45;}
.wip-bucket-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;}
.wip-bucket-val{font-size:18px;font-weight:600;color:var(--amb);font-family:'IBM Plex Mono',monospace;line-height:1;flex:1;text-align:center;}
.wip-bucket-meta{display:none;}

/* WIP per area+line layout — compressed */
.wip-area-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--amb);margin:10px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--bdr);}
.wip-area-label:first-child{margin-top:0;}
.wip-line-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin-bottom:5px;}
.wip-line-label{padding-right:4px;display:flex;align-items:baseline;gap:6px;}
.wip-line-name{font-size:12px;font-weight:600;color:var(--txt);}
.wip-line-meta{font-size:9.5px;color:var(--mut2);font-family:'IBM Plex Mono',monospace;}

@media(max-width:700px){
  .wip-bucket-cards{grid-template-columns:repeat(3,1fr);gap:4px;}
  .wip-bucket-val{font-size:15px;}
  .wip-bucket-card{padding:6px 6px;gap:5px;}
  .wip-bucket-time{font-size:9px;}
  .wip-line-row{grid-template-columns:1fr;gap:3px;margin-bottom:8px;}
  .wip-line-label{padding-right:0;}
}

/* ── UPH BOARD ───────────────────────────────────────────────────────────── */
.uph-grid{display:flex;flex-direction:column;gap:1px;overflow-x:auto;padding:14px 16px;}
.uph-row{display:grid;grid-template-columns:140px 1fr;gap:6px;align-items:center;}
.uph-row.uph-row-hdr{margin-bottom:2px;}
.uph-row-label{font-family:'IBM Plex Mono',monospace;text-align:right;padding-right:6px;line-height:1.1;}
.uph-row-line{font-size:11.5px;color:var(--txt);font-weight:600;}
.uph-row-meta{font-size:9.5px;color:var(--mut2);margin-top:2px;letter-spacing:.02em;}
.uph-row-label-hdr{height:14px;}
.uph-row-cells{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;min-width:560px;}
.uph-cell{height:24px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--txt);background:#1c2128;cursor:default;transition:transform .12s;}
.uph-cell:hover{transform:scale(1.15);outline:1px solid var(--amb);z-index:1;position:relative;}
.uph-cell-hdr{font-size:9px;color:var(--mut2);background:transparent;height:14px;}
.uph-cell-shift{color:var(--amb);font-weight:600;border-left:1px solid rgba(var(--amb-rgb), .3);}

/* Heatmap shift-boundary marker (matches UPH board) */
.dt-heatmap-hours .dt-shift-boundary{color:var(--amb);font-weight:600;border-left:1px solid rgba(var(--amb-rgb), .3);}
.uph-cell-empty{background:#161b22;border:1px dashed var(--bdr);}
.uph-area-row{margin-top:14px;margin-bottom:4px;padding:0 0 4px 0;border-bottom:1px solid var(--bdr);}
.uph-area-row:first-child{margin-top:0;}
.uph-area-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--amb);}
.uph-legend{display:flex;align-items:center;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--bdr);margin-top:8px;}

/* ── RECENT FEED ─────────────────────────────────────────────────────────── */
.feed{background:var(--bg);border:1px solid var(--bdr);border-radius:8px;}
.feed-row{padding:11px 16px;border-bottom:1px solid var(--bdr);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;transition:background .12s;}
.feed-row:last-child{border-bottom:none;}
.feed-row:hover{background:rgba(255,255,255,.02);}
.feed-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:3px;white-space:nowrap;}
.feed-tag.scout-car{background:rgba(var(--amb-rgb), .12);color:var(--amb);}
.feed-tag.scout-wav{background:rgba(var(--amb-rgb), .12);color:var(--amb);}
.feed-tag.scout-pott{background:rgba(var(--amb-rgb), .12);color:var(--amb);}
.feed-tag.shift-pott{background:rgba(63,185,80,.12);color:var(--grn);}
.feed-tag.shift-wav{background:rgba(56,139,253,.12);color:var(--blu);}
.feed-tag.shift-car{background:rgba(163,113,247,.12);color:var(--pur);}
.feed-text{font-size:13px;color:var(--txt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.feed-text strong{color:var(--txt);}
.feed-text .feed-meta{font-size:11px;color:var(--mut);font-family:'IBM Plex Mono',monospace;display:block;margin-top:2px;}
.feed-when{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut2);white-space:nowrap;}
.feed-link{color:inherit;text-decoration:none;display:contents;}

/* ── TOAST ──────────────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:22px;right:22px;padding:11px 18px;border-radius:7px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.45);transform:translateY(70px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:999;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.t-ok{background:var(--grn);color:#000;}
.t-warn{background:var(--red);color:#fff;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px;}

/* ── MOBILE ─────────────────────────────────────────────────────────────── */
@media(max-width:860px){
  .site-header{padding:0 14px;height:52px;}
  .logo{font-size:11px;}
  .main{padding:14px 14px 40px;}
  .page-title{font-size:18px;}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{padding:14px 16px;}
  .kpi-val{font-size:22px;}
  .dt-grid{grid-template-columns:1fr;}
  .scout-grid{grid-template-columns:1fr 1fr 1fr;}
  .panel-body{padding:14px;}
  .panel-head{padding:11px 14px;}
  .chart-wrap{height:200px;}
  .feed-row{grid-template-columns:auto 1fr;gap:8px;padding:10px 12px;}
  .feed-when{grid-column:2;font-size:10px;margin-top:2px;}
  .range-pills{flex:1;}
  .rpill{flex:1;text-align:center;padding:7px 4px;}
  .refresh-btn{margin-left:0;}
  .tech-row{grid-template-columns:100px 1fr 40px;gap:10px;padding:8px 14px;}
  .tech-name{font-size:12px;}
  .tech-count{font-size:14px;}
  .tech-legend{padding:10px 14px;gap:12px;}
  .hrow{grid-template-columns:50px 1fr;gap:3px;}
  .hrow-label{font-size:9.5px;padding-right:2px;}
  .hcell{height:18px;font-size:9px;}
  .hcell-hdr{font-size:8px;}
  .wip-line-pills{flex-wrap:wrap;}
  .wpill{padding:5px 10px;font-size:10.5px;}
  .uph-row{grid-template-columns:90px 1fr;gap:4px;}
  .uph-row-line{font-size:10.5px;}
  .uph-row-meta{font-size:9px;}
  .uph-cell{height:20px;font-size:9px;}
  .uph-cell-hdr{font-size:8px;}
  .uph-grid{padding:10px 12px;}
}
@media(max-width:480px){
  .scout-grid{grid-template-columns:1fr;}
}

/* ── LANGUAGE TOGGLE ─────────────────────────────────────── */
.lang-toggle{
  display:inline-flex;align-items:center;
  background:rgba(0,0,0,.25);border:1px solid var(--bdr,#21262d);
  border-radius:6px;padding:2px;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;font-weight:600;letter-spacing:.04em;
  cursor:pointer;user-select:none;flex-shrink:0;
}
.lang-toggle span{padding:4px 9px;border-radius:4px;color:var(--mut2,#6e7681);transition:all .15s;}
.lang-toggle span.active{background:rgba(var(--amb-rgb), .18);color:var(--amb,var(--amb));}

/* ═══ PRINT / PDF EXPORT ═══════════════════════════════════════════════════
 * Triggered by the 🖨 Print button → window.print(). Users can choose
 * "Save as PDF" in the OS print dialog. We hide interactive controls and
 * shift to a paper-friendly layout.
 * ════════════════════════════════════════════════════════════════════════ */
@media print {
  @page { size: letter landscape; margin: 0.4in; }
  body { background: #fff !important; color: #000 !important; }
  /* Hide things that don't make sense on paper */
  .controls, .filters, .refresh-btn, .layout-toggle-btn, .lang-toggle,
  .panel-range-pills, .pview-btn, .panel-head-arrow,
  .pin-btn, #colorPickerBtn, .toast-host, .site-header a.back,
  .csv-btn { display: none !important; }
  /* Stop sticky header from eating content on paper */
  .site-header { position: static !important; box-shadow: none !important; border-bottom: 1px solid #999 !important; }
  /* Each panel starts on its own piece of paper if it's tall */
  .panel { break-inside: avoid; page-break-inside: avoid; box-shadow: none !important; border: 1px solid #ccc !important; background: #fff !important; margin-bottom: 12px !important; }
  .tier-section { break-after: auto; }
  .tier-label { color: #000 !important; border-bottom-color: #000 !important; font-weight: 700 !important; }
  /* Force black text — dashboard is too dark for paper */
  h1, h2, h3, .panel-head h2, .panel-meta, .kpi-num, .oee-num, .oee-big,
  .pareto-mins, .pareto-cum, .shift-card-cur, .shift-card-target,
  .tech-name, .pareto-label, .co-area, .pareto-row {
    color: #000 !important;
  }
  /* Bars stay visible but grayscale */
  .pareto-bar-fill, .shift-card-fill, .kpi-bar-fill, .tech-bar-seg {
    background: #444 !important;
  }
  /* Vital-few rows highlighted differently for print (border instead of color) */
  .pareto-vital { background: #eee !important; border-left: 3px solid #000 !important; }
  /* Don't let panels be huge */
  .tech-list { max-height: none !important; }
  .feed-list { max-height: none !important; }
  /* Print-only header on first page so PDFs are identifiable */
  body::before {
    content: "Salcomp Automation — Analytics Dashboard · " attr(data-print-date);
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #555;
    border-bottom: 1px solid #999;
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
}
</style>
</head>
<body>

<header class="site-header">
  <a class="back" href="index.html">← Back</a>
  <div class="logo">📊 Salcomp — Analytics Dashboard</div>
  <div class="hdr-right">
    <span class="live-dot"><span id="hdrDate"></span></span>
  </div>

  <button class="lang-toggle" onclick="toggleLanguage()" title="Switch language · Cambiar idioma · Đổi ngôn ngữ">
    <span class="lang-en active">EN</span><span class="lang-es">ES</span>
  </button>
</header>

<main class="main">

  <div class="page-title" data-i18n="analytics.title">Operations Overview</div>
  <div class="page-sub" data-i18n="analytics.subtitle">Live data from all check sheets and shift reports — auto-pulls from Supabase on load.</div>

  <!-- TYPE FILTER -->
  <div class="type-filter-row">
    <span class="type-filter-label">Show:</span>
    <div class="type-pills" id="typePills">
      <button class="tpill active" data-type="all"><span>All</span><span class="tpill-count" id="tcnt-all">0</span></button>
      <button class="tpill" data-type="shift">📋 <span>Shift Reports</span><span class="tpill-count" id="tcnt-shift">0</span></button>
      <button class="tpill" data-type="pm">🔧 <span>PM Reports</span><span class="tpill-count" id="tcnt-pm">0</span></button>
      <button class="tpill" data-type="scout">👁 <span>Scout Reports</span><span class="tpill-count" id="tcnt-scout">0</span></button>
    </div>
  </div>

  <!-- AREA FILTER — isolate traditional lines vs Battery/IQ9 commercial lines -->
  <div class="type-filter-row">
    <span class="type-filter-label">Area:</span>
    <div class="type-pills" id="areaPills">
      <button class="tpill apill active" data-area="all"><span>All Areas</span></button>
      <button class="tpill apill" data-area="traditional"><span>Carousel · Potting · Wave-3</span></button>
      <button class="tpill apill" data-area="commercial">🔋🔦 <span>Battery · IQ9</span></button>
    </div>
  </div>

  <!-- DATE RANGE -->
  <div class="range-row">
    <div class="range-pills" id="rangePills">
      <button class="rpill active" data-days="1" data-i18n="analytics.range.24h">24 hr</button>
      <button class="rpill" data-days="7" data-i18n="analytics.range.7">7 day</button>
      <button class="rpill" data-days="30" data-i18n="analytics.range.30">30 day</button>
      <button class="rpill" data-days="90" data-i18n="analytics.range.90">90 day</button>
      <button class="rpill" data-days="0" data-i18n="analytics.range.all">All time</button>
      <button class="rpill" data-days="custom" data-i18n="analytics.range.custom">Custom…</button>
    </div>
    <div class="custom-range" id="customRange" style="display:none;">
      <input type="date" id="customFrom" class="custom-date-input">
      <span class="custom-range-sep">→</span>
      <input type="date" id="customTo" class="custom-date-input">
      <button class="custom-range-apply" onclick="applyCustomRange()" data-i18n="analytics.custom.apply">Apply</button>

function relTime(iso){

// ── DATA FETCH ─────────────────────────────────────────────────────────────────
async function fetchTable(src, sinceIso){

    let url = `${SB_URL}/rest/v1/${src.table}?order=submitted_at.desc&limit=500`;

  }
}

// Track most-recent submitted_at per table for incremental refresh
let _incrementalCursors = {};

function recomputeCursors(){
  _incrementalCursors = {};
  SOURCES.forEach(s => {
    const rows = allData[s.key] || [];
    if(rows.length === 0) return;
    // Rows already sorted desc by submitted_at — first row is newest
    _incrementalCursors[s.key] = rows[0].submitted_at;
  });
}

function mergeIncremental(srcKey, newRows){
  if(!Array.isArray(newRows) || newRows.length === 0) return false;
  const existing = allData[srcKey] || [];
  const existingIds = new Set(existing.map(r => r.id));
  // Add rows that aren't already present (defensive against re-fetched cursor row)
  const fresh = newRows.filter(r => !existingIds.has(r.id));
  if(fresh.length === 0) return false;
  // Prepend fresh rows; data stays sorted desc by submitted_at
  allData[srcKey] = fresh.concat(existing);
  return true;
}

    _lastFetchTime = Date.now();
    if(showToastMsg === true) showToast('✓ Refreshed — all sources','t-ok');
    render();
    return;
  }

  // Silent auto-refresh — incremental fetch only
  if(!haveData){
    // Edge case: no baseline yet, do a full fetch instead

    allData = {};
    SOURCES.forEach((s,i) => { allData[s.key] = results[i] || []; });
    recomputeCursors();
    _lastFetchTime = Date.now();
    render();
    return;

  const results = await Promise.all(
    SOURCES.map(s => fetchTable(s, _incrementalCursors[s.key]))
  );

  });
