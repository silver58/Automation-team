function drawProductionChart(prod){
  const el = document.getElementById('prodChart');
  if(!el || !prod.days.length) return;
  const W = el.clientWidth, H = el.clientHeight;
  const padL = 38, padR = 14, padT = 12, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;

  let max = 0;
  prod.days.forEach(d => {
    const v = prod.byDay[d];
    const total = (v.pott||0) + (v.wav||0) + (v.car||0);
    if(total > max) max = total;
  });
  if(max===0) max = 10;
  const niceMax = niceRoundUp(max);

  const gridY = [0, 0.25, 0.5, 0.75, 1].map(t => Math.round(niceMax*t));
  const yPos = v => padT + innerH - (v/niceMax)*innerH;

  const sources = ['car','pott','wav'];
  const colors = {pott:'#3fb950', wav:'#388bfd', car:'#a371f7'};
  const xPos = i => prod.days.length>1
    ? padL + (i/(prod.days.length-1))*innerW
    : padL + innerW/2;

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;

  // Y grid
  gridY.forEach(v => {
    const y = yPos(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#21262d" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#6e7681">${v}</text>`;
  });

  // GOAL LINE — horizontal target
  if(typeof prodGoal === 'number' && prodGoal > 0 && prodGoal <= niceMax){
    const gy = yPos(prodGoal);
    svg += `<line class="goal-line" x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}"/>`;
    svg += `<text class="goal-label" x="${W-padR-3}" y="${gy-4}" text-anchor="end">${t('prod.target_n')} ${prodGoal}</text>`;
  }

  // X labels — sparse, with red dot if day was a "missing" day
  const labelEvery = Math.max(1, Math.ceil(prod.days.length/6));
  prod.days.forEach((d, i) => {
    const x = xPos(i);
    const v = prod.byDay[d];
    const total = (v.pott||0) + (v.wav||0) + (v.car||0);
    // Mark days with no data as a faint dashed vertical
    if(total === 0){
      svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+innerH}" stroke="#30363d" stroke-width="1" stroke-dasharray="2,3" opacity=".4"/>`;
    }
    if(i % labelEvery !== 0 && i !== prod.days.length-1) return;
    svg += `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="9" fill="#6e7681">${dayLabel(d)}</text>`;
  });

  // Data lines + clickable circles (drill-down by day)
  sources.forEach(s => {
    const pts = prod.days.map((d,i) => [xPos(i), yPos(prod.byDay[d][s]||0)]);
    if(pts.length>1){
      const path = pts.map((p,i)=> (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
      svg += `<path d="${path}" fill="none" stroke="${colors[s]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    pts.forEach((p, i) => {
      const day = prod.days[i];
      svg += `<circle class="bar-clickable" cx="${p[0]}" cy="${p[1]}" r="3" fill="${colors[s]}" onclick="setDrill('day','${day}')"><title>${day} — click to drill</title></circle>`;
    });
  });

  svg += '</svg>';
  el.innerHTML = svg;
}

// Build downtime-by-hour-of-day grid: per-area + total
function buildDowntimeByHour(){
  const rows = rowsForPanel('downtime', applyDrill(filteredRows()));
  const deduped = dedupShiftRows(rows);
  // hours[area][24] in minutes
  const blank = () => Array(24).fill(0);
  const data = {Total: blank(), Carousel: blank(), Potting: blank(), 'Wave-3': blank()};
  const areaMap = {'shift-pott':'Potting','shift-wav':'Wave-3','shift-car':'Carousel'};
  const shiftStarts = {'A':6,'B':14,'C':22};
  let max = 0;
  let hasData = false;
  deduped.forEach(r => {
    if(r.src.kind!=='shift') return;
    const area = areaMap[r.src.key];
    if(!area) return;
    // First, distribute hourly downtime if present
    if(Array.isArray(r.row.downtime_hrs)){
      const startHour = shiftStarts[(r.row.shift||'').trim().charAt(0).toUpperCase()];
      if(startHour != null){
        for(let i=0;i<8 && i<r.row.downtime_hrs.length;i++){
          const v = parseFloat(r.row.downtime_hrs[i]);
          if(isNaN(v)||v<=0) continue;
          const h = (startHour + i) % 24;
          data[area][h] += v;
          data.Total[h] += v;
          hasData = true;
        }
      }
    }
    // Plus major downtime events (use 'from' time as the bucketing hour)
    const events = r.row.downtime_events;
    if(Array.isArray(events)){
      events.forEach(ev => {
        const mins = parseFloat(ev.mins);
        if(isNaN(mins)||mins<=0) return;
        const fromMatch = String(ev.from||'').match(/^(\d{1,2}):/);
        if(!fromMatch) return;
        const h = parseInt(fromMatch[1]) % 24;
        // We've already counted hourly above. To avoid double-counting, add only if hourly array didn't exist.
        if(!Array.isArray(r.row.downtime_hrs) || r.row.downtime_hrs.every(v => parseFloat(v)===0 || isNaN(parseFloat(v)))){
          data[area][h] += mins;
          data.Total[h] += mins;
          hasData = true;
        }
      });
    }
  });
  // Compute max for color scaling
  data.Total.forEach(v => { if(v > max) max = v; });
  return {data, max, hasData};
}

function renderDowntimeHeatmap(heat){
  // Color scale: green (low) → amber (mid) → red (high)
  const cellColor = mins => {
    if(mins === 0) return 'var(--bg)';
    const ratio = Math.min(1, mins / heat.max);
    if(ratio < 0.33) return `rgba(63,185,80,${0.18 + ratio * 0.6})`;
    if(ratio < 0.66) return `rgba(240,165,0,${0.25 + ratio * 0.5})`;
    return `rgba(248,81,73,${0.3 + ratio * 0.5})`;
  };
  // Rotate the 24-hour array so it starts at 6am instead of midnight.
  // Index 0 of the displayed row = 6am, index 23 = 5am next day.
  const rotateTo6am = arr => {
    const out = [];
    for(let i = 0; i < 24; i++) out.push(arr[(i + 6) % 24]);
    return out;
  };
  const hourAt = displayIdx => (displayIdx + 6) % 24;
  const buildRow = (label, hours) => {
    const rotated = rotateTo6am(hours);
    return `
      <div class="dt-heatmap-lbl">${escapeHtml(label)}</div>
      ${rotated.map((mins, displayIdx) => {
        const realHour = hourAt(displayIdx);
        const color = cellColor(mins);
        const tooltip = mins > 0 ? `${Math.round(mins)} min @ ${realHour}:00` : `none @ ${realHour}:00`;
        return `<div class="dt-heatmap-cell" style="background:${color}" data-tooltip="${tooltip}">${mins>0?Math.round(mins):''}</div>`;
      }).join('')}
    `;
  };
  // Hour labels: 6, 7, 8 ... 23, 0, 1, 2, 3, 4, 5
  // Mark shift boundaries: 6am (A start), 14 (B start), 22 (C start)
  const hourLabels = Array.from({length:24}, (_,i) => {
    const h = (i + 6) % 24;
    const isShiftBoundary = (h === 6 || h === 14 || h === 22);
    return `<div${isShiftBoundary ? ' class="dt-shift-boundary"' : ''}>${h}</div>`;
  }).join('');
  return `
    <div style="margin-top:18px;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;">${t('dt.by_hour')}</div>
      <div class="dt-heatmap-hours"><div></div>${hourLabels}</div>
      <div class="dt-heatmap">
        ${buildRow('Total', heat.data.Total)}
        ${buildRow('Carousel', heat.data.Carousel)}
        ${buildRow('Potting', heat.data.Potting)}
        ${buildRow('Wave-3', heat.data['Wave-3'])}
      </div>
    </div>`;
}

  const innerW = W - padL - padR, innerH = H - padT - padB;

  let max = 0;
  dt.days.forEach(d => { if(dt.byDay[d] > max) max = dt.byDay[d]; });
  if(max===0) max = 10;
  const niceMax = niceRoundUp(max);

  const gridY = [0, 0.25, 0.5, 0.75, 1].map(t => Math.round(niceMax*t));
  const yPos = v => padT + innerH - (v/niceMax)*innerH;

  // Bars
  const barCount = dt.days.length;
  const barGap = 4;
  const barW = Math.max(6, (innerW - barGap*(barCount-1))/barCount);

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;

  gridY.forEach(v => {
    const y = yPos(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#21262d" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#6e7681">${v}</text>`;
  });

  dt.days.forEach((d, i) => {
    const x = padL + i*(barW+barGap);
    const v = dt.byDay[d];
    const y = yPos(v);
    const h = padT + innerH - y;
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="var(--amb)" opacity="0.85" rx="2"/>`;
    if(barCount<=14 || i % Math.ceil(barCount/8) === 0){
      svg += `<text x="${x+barW/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="#6e7681">${dayLabel(d)}</text>`;
    }
  });

  svg += '</svg>';
  el.innerHTML = svg;
}

// ── UPH Board ───────────────────────────────────────────────────────────────
function renderUphBoard(uph){
  if(uph.rows.length === 0){
    return `
      <div class="panel" data-panel-key="uph">
        <div class="panel-head"><h2><a class="panel-head-link" href="Analytics_Detail.html?subject=uph" onclick="event.stopPropagation()" title="Open detail page">${t('analytics.panel.uph')}<span class="panel-head-arrow">→</span></a></h2></div>
        <div class="panel-body">
          <div class="empty"><div class="empty-icon">📊</div>${t('analytics.empty.uph')}</div>
        </div>
      </div>`;
  }
  // Build hour-header row starting at 6am (6, 7, ... 23, 0, 1, ... 5)
  // Mark shift boundaries: 6 (A start), 14 (B start), 22 (C start)
  const hourHdr = Array.from({length:24}, (_,i) => {
    const h = (i + 6) % 24;
    const cls = (h === 6 || h === 14 || h === 22) ? 'uph-cell uph-cell-hdr uph-cell-shift' : 'uph-cell uph-cell-hdr';
    return `<div class="${cls}">${String(h).padStart(2,'0')}</div>`;
  }).join('');

  // Group rows by area for visual section breaks
  const byArea = {};
  uph.rows.forEach(g => {
    if(!byArea[g.area]) byArea[g.area] = [];
    byArea[g.area].push(g);
  });

  let bodyHtml = '';
  Object.entries(byArea).forEach(([area, groups]) => {
    // Area header (spans full width)
    bodyHtml += `<div class="uph-area-row"><div class="uph-area-label">${escapeHtml(area)}</div></div>`;
    groups.forEach(g => {
      // Render cells from 6am → 5am next day (rotate the underlying [0..23] arrays)
      const cells = Array.from({length:24}, (_, displayIdx) => {
        const h = (displayIdx + 6) % 24;
        const v = g.hours[h];
        if(g.cellCount[h] === 0){
          return `<div class="uph-cell uph-cell-empty" title="Hour ${String(h).padStart(2,'0')}: no data"></div>`;
        }
        const color = uphColor(v, uph.max);
        const tip = `${escapeHtml(g.area)} · Line ${escapeHtml(g.line)} · ${String(h).padStart(2,'0')}:00 — ${Math.round(v)} units`;
        return `<div class="uph-cell" style="background:${color}" title="${tip}">${Math.round(v)}</div>`;
      }).join('');
      const lineLabel = g.line === '—' ? t('analytics.uph.unknown_line') : `${t('analytics.uph.line')} ${escapeHtml(g.line)}`;
      bodyHtml += `
        <div class="uph-row">
          <div class="uph-row-label">
            <div class="uph-row-line">${lineLabel}</div>
            <div class="uph-row-meta">${g.total.toLocaleString()} · ${g.reportCount} ${t('analytics.uph.reports_short')}</div>
          </div>
          <div class="uph-row-cells">${cells}</div>
        </div>`;
    });
  });

  return `
    <div class="panel" data-panel-key="kpis">
      <div class="panel-head">
        <h2>${t('analytics.panel.uph')}</h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${renderPanelRangeBadge('uph')}
          <div class="panel-meta">${t('analytics.uph.subtitle')}</div>
        </div>
      </div>
      <div class="panel-body" style="padding:0">
        <div class="uph-grid">
          <div class="uph-row uph-row-hdr">
            <div class="uph-row-label uph-row-label-hdr"></div>
            <div class="uph-row-cells">${hourHdr}</div>
          </div>
          ${bodyHtml}
        </div>
        <div class="uph-legend">
          <span class="wip-legend-label">${t('analytics.legend.less')}</span>
          <div class="wip-legend-scale">
            ${[0,0.2,0.4,0.6,0.8,1].map(v => `<div class="wip-legend-cell" style="background:${uphColor(v,1)}"></div>`).join('')}
          </div>
          <span class="wip-legend-label">${t('analytics.legend.more')}</span>
          <span class="wip-legend-meta">${t('analytics.legend.peak')} ${Math.round(uph.max)}/hr</span>
        </div>
      </div>
    </div>`;
}

function uphColor(value, max){
  if(value === null || max === 0) return '#1c2128';
  const t = Math.max(0, Math.min(1, value / max));
  const alpha = 0.06 + t * 0.89;
  return `rgba(240,165,0,${alpha.toFixed(3)})`;
}

// ── Scout flags ─────────────────────────────────────────────────────────────
function renderScout(scout, flags){
  const card = (key, label) => {
    const s = scout[key];
    const inv = scout.__inventoryFor?.[key];
    const cls = s.attnTotal>0 ? 'has-attn' : (s.reports>0 ? 'clean' : '');
    const meta = s.reports===0 ? 'no reports yet' : `from ${s.reports} report${s.reports!==1?'s':''}`;
    // Coverage row: which machines have been scouted
    let coverageHtml = '';
    if(inv){
      const covered = s.covered;
      const pct = Math.round((covered.size / inv.lines.length) * 100);
      const covColor = pct === 100 ? 'var(--grn)' : pct >= 50 ? 'var(--amb)' : 'var(--red)';
      const chipsHtml = inv.lines.map(ln => {
        const done = covered.has(ln);
        return `<span class="pm-cov-chip ${done?'pm-cov-chip-done':'pm-cov-chip-missing'}" title="Line ${escapeHtml(ln)} — ${done?'Scouted in range':'Not scouted yet'}">${done?'✓':'○'} ${escapeHtml(ln)}</span>`;
      }).join('');
      coverageHtml = `
        <div class="scout-coverage">
          <div class="pm-cov-bar"><div class="pm-cov-fill" style="width:${pct}%;background:${covColor}"></div></div>
          <div class="pm-cov-row">
            <span class="pm-cov-pct" style="color:${covColor}">${covered.size} / ${inv.lines.length} scouted</span>
            <span class="pm-cov-meta">${pct}%</span>
          </div>
          <div class="pm-cov-missing">${chipsHtml}</div>
        </div>`;
    }
    return `
      <a class="scout-card ${cls}" href="Scout_Flags.html">
        <div class="scout-card-name">${label}</div>
        <div class="scout-card-num">${s.attnTotal}</div>
        <div class="scout-card-meta">${meta}</div>
        ${coverageHtml}
      </a>`;
  };

  const totalFlags = flags.length;
  // Overall scout coverage across all 3 areas
  const overallCovered = ['scout-car','scout-pott','scout-wav'].reduce((sum, k) => sum + (scout[k]?.covered.size || 0), 0);
  const overallCovBadge = `<span class="pm-cov-badge ${overallCovered===TOTAL_MACHINES?'pm-cov-badge-good':overallCovered>=TOTAL_MACHINES/2?'pm-cov-badge-mid':'pm-cov-badge-low'}" title="${overallCovered} of ${TOTAL_MACHINES} machines scouted in this period">${overallCovered}/${TOTAL_MACHINES} machines scouted</span>`;

  return `
    <div class="panel" data-panel-key="scout">
      <div class="panel-head">
        ${renderPanelRangeBadge('scout')}<h2 style="margin-right:auto"><a class="panel-head-link" href="Analytics_Detail.html?subject=scout" onclick="event.stopPropagation()" title="Open detail page">${t('analytics.panel.scout')}<span class="panel-head-arrow">→</span></a></h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${overallCovBadge}
          <a class="flags-review-btn" href="Scout_Flags.html">${t('analytics.flags.button')}</a>
          <div class="panel-meta">${totalFlags} item${totalFlags!==1?'s':''} needing attention</div>
        </div>
      </div>
      <div class="panel-body">
        <div class="scout-grid">
          ${card('scout-car', 'Carousel Scout')}
          ${card('scout-pott','Potting Scout')}
          ${card('scout-wav', 'Wave-3 Scout')}
        </div>
      </div>
    </div>`;
}

// CSV EXPORT
// ──────────────────────────────────────────────────────────────────
function csvEscape(v){
  if(v == null) return '';
  const s = String(v);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadCsv(filename, headers, rows){
  const csv = [headers.map(csvEscape).join(',')]
    .concat(rows.map(r => r.map(csvEscape).join(',')))
    .join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
function exportProductionCsv(){
  const rows = filteredRows();
  const prod = buildProductionSeries(rows);
  const out = [];
  prod.days.forEach(day => {
    const v = prod.byDay[day] || {pott:0, wav:0, car:0};
    out.push([day, v.car || 0, v.pott || 0, v.wav || 0, (v.car||0)+(v.pott||0)+(v.wav||0)]);
  });
  downloadCsv('production-by-day.csv', ['Date','Carousel','Potting','Wave-3','Total'], out);
}
function exportDowntimeCsv(){
  const rows = filteredRows();
  const deduped = dedupShiftRows(rows);
  const out = [];
  deduped.forEach(r => {
    if(r.src.kind !== 'shift') return;
    const events = r.row.downtime_events;
    if(!Array.isArray(events)) return;
    events.forEach(ev => {
      const mins = parseFloat(ev.mins);
      if(isNaN(mins) || mins <= 0) return;
      const areaMap = {'shift-pott':'Potting','shift-wav':'Wave-3','shift-car':'Carousel'};
      const type = ev.type || (ev.prob ? 'mech' : '');
      const typeLbl = type === 'mech' ? 'Mechanical' : type === 'prod' ? 'Production' : '';
      const desc = type === 'prod' ? (ev.cause || ev.prob || '') : (ev.prob || '');
      out.push([
        r.date || '',
        areaMap[r.src.key] || '',
        r.row.line || '',
        r.row.shift || '',
        r.row.tech_name || '',
        ev.from || '',
        ev.to || '',
        mins,
        typeLbl,
        desc,
        ev.action || '',
      ]);
    });
  });
  downloadCsv('downtime-events.csv',
    ['Date','Area','Line','Shift','Tech','From','To','Mins','Type','Problem / Cause','Action'], out);
}
function exportSubmissionsCsv(){
  const rows = filteredRows();
  const out = rows.map(r => [
    new Date(r.when).toISOString(),
    r.src.label || r.src.key,
    r.src.kind,
    r.row.tech || r.row.tech_name || '',
    r.row.line || '',
    r.row.shift || '',
    r.row.date || '',
    r.row.production_total || '',
    r.row.downtime_total || '',
    r.src.kind === 'scout' ? scoutAttnLive(r.row) : '',
  ]);
  downloadCsv('submissions.csv',
    ['Submitted','Source','Kind','Tech','Line','Shift','Date','UPH','Downtime','Flags'], out);
}

// ──────────────────────────────────────────────────────────────────
// DRILL-DOWN STATE
// ──────────────────────────────────────────────────────────────────
let drillFilter = null;  // {kind:'day', value:'2026-04-30'} | {kind:'tech', value:'John D.'} | {kind:'area', value:'Carousel'} | null

function applyDrill(rows){
  if(!drillFilter) return rows;
  return rows.filter(r => {
    if(drillFilter.kind === 'day'){
      return r.date === drillFilter.value;
    }
    if(drillFilter.kind === 'tech'){
      const tech = (r.row.tech || r.row.tech_name || '').trim().toLowerCase();
      return tech === drillFilter.value.toLowerCase();
    }
    if(drillFilter.kind === 'area'){
      const areaMap = {
        'shift-pott':'Potting','shift-wav':'Wave-3','shift-car':'Carousel',
        'scout-pott':'Potting','scout-wav':'Wave-3','scout-car':'Carousel',
      };
      const a = areaMap[r.src.key] || (r.row.area || '');
      return a === drillFilter.value;
    }
    return true;
  });
}
function setDrill(kind, value){
  drillFilter = (drillFilter && drillFilter.kind===kind && drillFilter.value===value) ? null : {kind, value};
  render();
}
function clearDrill(){ drillFilter = null; render(); }
function drillLabel(){
  if(!drillFilter) return '';
  if(drillFilter.kind === 'day')  return `Day: ${drillFilter.value}`;
  if(drillFilter.kind === 'tech') return `Tech: ${drillFilter.value}`;
  if(drillFilter.kind === 'area') return `Area: ${drillFilter.value}`;
  return drillFilter.value;
}

// ──────────────────────────────────────────────────────────────────
// AUTO-REFRESH (silent, every 60s)
// ──────────────────────────────────────────────────────────────────
let _autoRefreshTimer = null;
let _lastFetchTime = null;

function startAutoRefresh(){
  if(_autoRefreshTimer) clearInterval(_autoRefreshTimer);
  _autoRefreshTimer = setInterval(() => {
    // Don't refresh if user is interacting (e.g. inside custom date input)
    if(document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    loadAll(false);  // silent
  }, 60_000);
}
function stopAutoRefresh(){
  if(_autoRefreshTimer){ clearInterval(_autoRefreshTimer); _autoRefreshTimer = null; }
}
function formatLastFetch(){
  if(!_lastFetchTime) return '';
  const s = Math.round((Date.now() - _lastFetchTime) / 1000);
  if(s < 5)   return 'just now';
  if(s < 60)  return `${s}s ago`;
  if(s < 3600)return `${Math.round(s/60)}m ago`;
  return `${Math.round(s/3600)}h ago`;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function niceRoundUp(n){
  if(n<=10) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(n)));
  const norm = n/mag;
  let nice;
  if(norm<=1) nice=1;
  else if(norm<=2) nice=2;
  else if(norm<=5) nice=5;
  else nice=10;
  return nice * mag;
}
function showToast(msg,cls){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${cls} show`;
  setTimeout(()=>t.className='toast',3000);
}

// ── DATE PILL HANDLING ──────────────────────────────────────────────────────
document.getElementById('rangePills').addEventListener('click', e => {
  const btn = e.target.closest('.rpill');
  if(!btn) return;
  document.querySelectorAll('.rpill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const v = btn.dataset.days;
  const customRow = document.getElementById('customRange');
  if(v === 'custom'){
    rangeDays = 'custom';
    // Default range: last 14 days, only set if not already chosen
    if(!customFromDate || !customToDate){
      const today = new Date();
      const twoWeeksAgo = new Date(Date.now() - 14*86400000);
      customFromDate = twoWeeksAgo.toISOString().split('T')[0];
      customToDate = today.toISOString().split('T')[0];
      document.getElementById('customFrom').value = customFromDate;
      document.getElementById('customTo').value = customToDate;
    }
    customRow.style.display = 'inline-flex';
  } else {
    rangeDays = parseInt(v);
    customRow.style.display = 'none';
  }
  render();
});

function applyCustomRange(){
  const f = document.getElementById('customFrom').value;
  const tt = document.getElementById('customTo').value;
  if(!f || !tt){ showToast('Please select both From and To dates', 't-warn'); return; }
  if(new Date(f) > new Date(tt)){ showToast('From date must be before To date', 't-warn'); return; }
  customFromDate = f;
  customToDate = tt;
  rangeDays = 'custom';
  render();
}

document.getElementById('typePills').addEventListener('click', e => {
  const btn = e.target.closest('.tpill');
  if(!btn) return;
  typeFilter = btn.dataset.type;
  // Reset secondary filters when type changes so we don't end up in an unreachable state
  if(typeFilter !== 'scout') scoutFilter = 'all';
  render();
});

// Area filter — isolate traditional (car/pott/wav) vs commercial (bat/iq9) lines
document.getElementById('areaPills').addEventListener('click', e => {
  const btn = e.target.closest('.apill');
  if(!btn) return;
  areaFilter = btn.dataset.area;
  document.querySelectorAll('.apill').forEach(b => {
    b.classList.toggle('active', b.dataset.area === areaFilter);
  });
  render();
});

// ── REDRAW CHARTS ON RESIZE ─────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const rows = filteredRows();
    if(rows.length===0) return;
    drawProductionChart(buildProductionSeries(rows));
    drawDowntimeChart(buildDowntimeSeries(filterByLocalDtRange(rows)));
  }, 200);
});

// ──────────────────────────────────────────────────────────────────
// LAYOUT MODE — let user swap between tiered (new) and flat (legacy) layouts
// ──────────────────────────────────────────────────────────────────
const LAYOUT_KEY = 'salcomp_layout_mode';
let layoutMode = (() => {
  try { return localStorage.getItem(LAYOUT_KEY) || 'tiered'; } catch(e){ return 'tiered'; }
})();

function syncLayoutBtn(){
  const btn = document.getElementById('layoutToggleBtn');
  if(!btn) return;
  if(layoutMode === 'tiered'){
    btn.textContent = '⊞ Tiered';
    btn.title = 'Currently in Tiered (engineering) view — click to switch to Flat (legacy) view';
  } else {
    btn.textContent = '☰ Flat';
    btn.title = 'Currently in Flat (legacy) view — click to switch to Tiered (engineering) view';
  }
}

window.toggleLayout = function(){
  layoutMode = (layoutMode === 'tiered') ? 'flat' : 'tiered';
  try { localStorage.setItem(LAYOUT_KEY, layoutMode); } catch(e){}
  syncLayoutBtn();
  render();
};

// ──────────────────────────────────────────────────────────────────
// PINNED PANELS — let engineers star their most-watched panels to top
// ──────────────────────────────────────────────────────────────────
const PINNED_KEY = 'salcomp_pinned_panels';
function getPinnedSet(){
  try {
    const raw = localStorage.getItem(PINNED_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch(e){ return new Set(); }
}
function savePinnedSet(set){
  try { localStorage.setItem(PINNED_KEY, JSON.stringify([...set])); } catch(e){}
}
function togglePin(panelKey){
  const set = getPinnedSet();
  if(set.has(panelKey)) set.delete(panelKey); else set.add(panelKey);
  savePinnedSet(set);
  render();
}
// After rendering, inject a small pin button into each panel's head
function injectPinButtons(){
  const pinned = getPinnedSet();
  document.querySelectorAll('.panel[data-panel-key]').forEach(p => {
    const key = p.dataset.panelKey;
    const head = p.querySelector('.panel-head');
    if(!head || head.querySelector('.pin-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'pin-btn' + (pinned.has(key) ? ' pin-on' : '');
    btn.textContent = pinned.has(key) ? '★' : '☆';
    btn.title = pinned.has(key) ? 'Unpin from top' : 'Pin to top';
    btn.addEventListener('click', e => {
      e.stopPropagation();
      togglePin(key);
    });
    head.appendChild(btn);
  });
}

// ──────────────────────────────────────────────────────────────────
// COLLAPSIBLE PANELS — click any panel head to fold/unfold the body
// State persisted by panel title (matches across renders + reloads)
// ──────────────────────────────────────────────────────────────────
const PANEL_COLLAPSED_KEY = 'salcomp_panel_collapsed';

function getCollapsedSet(){
  try {
    const raw = localStorage.getItem(PANEL_COLLAPSED_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch(e){ return new Set(); }
}
function saveCollapsedSet(set){
  try { localStorage.setItem(PANEL_COLLAPSED_KEY, JSON.stringify([...set])); } catch(e){}
}
function panelKey(panel){
  const h2 = panel.querySelector('.panel-head h2');
  if(!h2) return null;
  // Strip non-text and whitespace to get a stable key
  return (h2.textContent || '').trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
}
function applyCollapsedState(){
  const collapsed = getCollapsedSet();
  document.querySelectorAll('.panel').forEach(p => {
    const k = panelKey(p);
    if(k && collapsed.has(k)) p.classList.add('collapsed');
    else p.classList.remove('collapsed');
  });
}
function togglePanelCollapse(panel){
  const k = panelKey(panel);
  if(!k) return;
  const collapsed = getCollapsedSet();
  if(collapsed.has(k)){
    collapsed.delete(k);
    panel.classList.remove('collapsed');
  } else {
    collapsed.add(k);
    panel.classList.add('collapsed');
  }
  saveCollapsedSet(collapsed);
}
// Delegated click handler — survives re-renders without rebinding
document.addEventListener('click', e => {
  // Ignore clicks on interactive children (buttons, links, inputs) inside the head
  if(e.target.closest('button, a, input, select, .legend-strip')) return;
  const head = e.target.closest('.panel-head');
  if(!head) return;
  const panel = head.closest('.panel');
  if(panel) togglePanelCollapse(panel);
});

// ── INIT ────────────────────────────────────────────────────────────────────
document.getElementById('hdrDate').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});

syncLayoutBtn();
loadAll();
startAutoRefresh();

// Set printable date stamp on the body so the print header has a date
window.addEventListener('beforeprint', () => {
  document.body.setAttribute('data-print-date',
    new Date().toLocaleString('en-US', {dateStyle:'full', timeStyle:'short'}));
});

window.onLangChange = function() {
  // Re-render the entire dashboard in the new language
  if (typeof render === 'function') render();
};
