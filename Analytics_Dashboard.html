}

// ── ROW NORMALIZATION ──────────────────────────────────────────────────────────
// Normalize any input that might be a date to a YYYY-MM-DD string, or null
function normalizeDateStr(v){
  if(!v) return null;
  const s = String(v).trim();
  if(!s) return null;
  // Already ISO-ish
  const isoMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(isoMatch) return `${isoMatch[1]}-${isoMatch[2].padStart(2,'0')}-${isoMatch[3].padStart(2,'0')}`;
  // US format M/D/YYYY or MM/DD/YYYY
  const usMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(usMatch) return `${usMatch[3]}-${usMatch[1].padStart(2,'0')}-${usMatch[2].padStart(2,'0')}`;
  // Generic Date parse fallback
  const d = new Date(s);
  if(!isNaN(d.getTime())){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return null;
}

// Each row → unified shape with .when, .source, .kind, .row (raw)
function normalizedRows(){
  const out = [];
  SOURCES.forEach(src => {
    (allData[src.key]||[]).forEach(row => {
      // Be defensive: row may be missing fields entirely on older records
      if(!row) return;
      const submittedAt = row.submitted_at || null;
      const dateStr = normalizeDateStr(row.date) || normalizeDateStr(submittedAt);
      out.push({
        src,
        when: submittedAt,
        date: dateStr,
        row,
      });
    });
  });
  return out;
}
// Helper: deduplicate shift rows by (area+line+shift+date), keeping the most recent.
// Rows are pre-sorted DESC by submitted_at, so the first occurrence wins.
// This prevents corrected/duplicate submissions from inflating production/downtime totals.
function dedupShiftRows(rows){
  const seen = new Set();
  const kept = [];
  rows.forEach(r => {
    if(r.src.kind !== 'shift'){ kept.push(r); return; }
    const line = (String(r.row.line || '').trim()) || '—';
    const key = `${r.src.key}|${line}|${r.row.shift || ''}|${r.date || ''}`;
    if(seen.has(key)) return;
    seen.add(key);
    kept.push(r);
  });
  return kept;
}

// Helper: count scout attention items live from the `sections` array
// rather than relying on the stored attn_count field (which may be stale
// if the report was edited after submission).
function scoutAttnLive(row){
  const stored = parseInt(row.attn_count);
  if(!Array.isArray(row.sections)){
    return isNaN(stored) ? 0 : stored;  // fall back to stored if no sections array
  }
  let n = 0;
  row.sections.forEach(sec => {
    if(Array.isArray(sec.flaggedItems)) n += sec.flaggedItems.length;
  });
  return n;
}

// Returns true if a row belongs to the currently-selected area group.
// 'traditional' = Carousel/Potting/Wave-3, 'commercial' = Battery/IQ9.
// Non-shift rows (PM, scout) only have area context for scouts; PM rows are
// area-tagged via their row.area field. Anything we can't classify stays
// visible under 'all' and is hidden under a specific area filter only if we
// can positively place it in the *other* group.
function inAreaFilter(r){
  if(areaFilter === 'all') return true;
  const COMMERCIAL_SHIFT = new Set(['shift-bat','shift-iq9']);
  const TRADITIONAL_SHIFT = new Set(['shift-car','shift-pott','shift-wav']);
  if(r.src.kind === 'shift'){
    if(areaFilter === 'commercial')  return COMMERCIAL_SHIFT.has(r.src.key);
    if(areaFilter === 'traditional') return TRADITIONAL_SHIFT.has(r.src.key);
  }
  if(r.src.kind === 'scout'){
    // All current scout sheets are traditional-area
    return areaFilter === 'traditional';
  }
  if(r.src.kind === 'pm'){
    // PM rows carry an `area` text field
    const a = String(r.row.area || '').toLowerCase();
    const isCommercial = a.includes('battery') || a.includes('iq9');
    return areaFilter === 'commercial' ? isCommercial : !isCommercial;
  }
  return true;
}

function filteredRows(){
  return normalizedRows().filter(r => {
    if(!withinRange(r.when)) return false;
    if(typeFilter !== 'all' && r.src.kind !== typeFilter) return false;
    if(!inAreaFilter(r)) return false;
    return true;
  });
}

// ── KPI COMPUTATIONS ───────────────────────────────────────────────────────────
function computeKpis(rows){
  // Dedupe shift rows first so corrected reports don't double-count
  const deduped = dedupShiftRows(rows);
  let reportCt = rows.length;
  let prodTotal = 0;
  let dtTotal = 0;
  let scoutAttn = 0;
  deduped.forEach(r => {
    if(r.src.kind==='shift'){
      const p = parseFloat(r.row.production_total);
      if(!isNaN(p)) prodTotal += p;
      const dt = parseFloat(r.row.downtime_total);
      if(!isNaN(dt)) dtTotal += dt;
    } else if(r.src.kind==='scout'){
      scoutAttn += scoutAttnLive(r.row);
    }
  });
  return {reportCt, prodTotal, dtTotal, scoutAttn};
}

// Compute KPIs for the PREVIOUS period of the same length (for delta comparison)
// e.g. "last 7 days" delta = current 7 days vs prior 7 days before that.
function computeKpisPrevPeriod(){
  const allNorm = normalizedRows();
  // Determine current period boundaries
  let curStart, curEnd, prevStart, prevEnd;
  if(rangeDays === 'custom'){
    if(!customFromDate || !customToDate) return null;
    curStart = new Date(customFromDate + 'T00:00:00').getTime();
    curEnd   = new Date(customToDate   + 'T23:59:59').getTime();
    const span = curEnd - curStart;
    prevEnd   = curStart - 1;
    prevStart = prevEnd - span;
  } else if(rangeDays === 0){
    return null;  // no comparison for "all time"
  } else {
    curEnd   = Date.now();
    curStart = curEnd - rangeDays*86400000;
    prevEnd   = curStart - 1;
    prevStart = prevEnd - rangeDays*86400000;
  }
  // Filter rows in the prev window, applying the active type + area filters
  const prevRows = allNorm.filter(r => {
    if(typeFilter !== 'all' && r.src.kind !== typeFilter) return false;
    if(!inAreaFilter(r)) return false;
    if(!r.when) return false;
    const t = new Date(r.when).getTime();
    return t >= prevStart && t <= prevEnd;
  });
  return computeKpis(prevRows);
}

// Compute % change with sensible handling of div-by-zero
function pctChange(cur, prev){
  if(prev === 0 && cur === 0) return null;       // both flat
  if(prev === 0) return Infinity;                 // grew from zero
  return ((cur - prev) / prev) * 100;
}

// ── PRODUCTION BY DAY × LINE ──────────────────────────────────────────────────
function buildProductionSeries(rows){
  // Dedupe first so a tech's corrected report doesn't double-count
  const deduped = dedupShiftRows(rows);
  const byDay = {};  // {dayKey: {pott:n, wav:n, car:n}}
  deduped.forEach(r => {
    if(r.src.kind!=='shift') return;
    const k = r.date;
    if(!k) return;
    const p = parseFloat(r.row.production_total);
    if(isNaN(p)) return;
    if(!byDay[k]) byDay[k] = {pott:0, wav:0, car:0};
    byDay[k][r.src.line] = (byDay[k][r.src.line]||0) + p;
  });
  // Fill missing days with zeros so absences show as gaps in the chart
  const days = fillMissingDays(Object.keys(byDay));
  days.forEach(k => { if(!byDay[k]) byDay[k] = {pott:0, wav:0, car:0, _missing:true}; });
  return {days, byDay};
}

// ── DOWNTIME ───────────────────────────────────────────────────────────────────
function buildDowntimeSeries(rows){
  const deduped = dedupShiftRows(rows);
  const byDay = {};  // {dayKey: total mins}
  deduped.forEach(r => {
    if(r.src.kind!=='shift') return;
    const k = r.date;
    if(!k) return;
    const dt = parseFloat(r.row.downtime_total);
    if(isNaN(dt)) return;
    byDay[k] = (byDay[k]||0) + dt;
  });
  const days = fillMissingDays(Object.keys(byDay));
  days.forEach(k => { if(byDay[k] == null) byDay[k] = 0; });
  return {days, byDay};
}

// Filter rows to the downtime panel's local time window (default 24hr)
// Uses an absolute "now - dtRangeHours" cutoff so the panel always shows recent data
// even when the global range is wider (e.g. 30 days).
function filterByLocalDtRange(rows){
  if(!dtRangeHours || dtRangeHours === 0) return rows;  // 0 = follow global
  const cutoff = Date.now() - dtRangeHours * 3600_000;
  return rows.filter(r => {
    if(!r.when) return false;
    const t = new Date(r.when).getTime();
    return !isNaN(t) && t >= cutoff;
  });
}

function fillMissingDays(dayKeys){
  if(!dayKeys.length) return [];
  const sorted = dayKeys.slice().sort();
  const start = new Date(sorted[0] + 'T00:00:00');
  const end = new Date(sorted[sorted.length-1] + 'T00:00:00');
  const out = [];
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    out.push(k);
  }
  return out;
}

function topCauses(rows){
  // Group by normalized problem text (case + whitespace insensitive)
  // Sort by total minutes lost (recurring small events outweigh one freak event)
  const deduped = dedupShiftRows(rows);
  const groups = {};  // {normalizedKey: {prob, type, mins, count, lastWhen, lastSrc, actions}}
  deduped.forEach(r => {
    if(r.src.kind!=='shift') return;
    const events = r.row.downtime_events;
    if(!Array.isArray(events)) return;
    events.forEach(ev => {
      const mins = parseFloat(ev.mins);
      if(isNaN(mins)||mins<=0) return;
      // Determine type — fall back for legacy events
      const type = ev.type || (ev.prob ? 'mech' : '');
      // For production events, the cause IS the description
      const probRaw = (type === 'prod')
        ? ((ev.cause || ev.prob || '').trim())
        : ((ev.prob || '').trim());
      if(!probRaw) return;
      // Group key includes type so "No Material" (prod) doesn't merge with a freak mechanical "no material" issue
      const norm = (type||'unknown') + '||' + probRaw.toLowerCase().replace(/\s+/g,' ');
      if(!groups[norm]){
        groups[norm] = {prob: probRaw, type, mins:0, count:0, lastWhen:r.when, lastSrc:r.src, actions:new Set()};
      }
      const g = groups[norm];
      g.mins += mins;
      g.count += 1;
      if(new Date(r.when) > new Date(g.lastWhen)){
        g.lastWhen = r.when;
        g.lastSrc = r.src;
        g.prob = probRaw;
      }
      const actionTxt = (ev.action||'').trim();
      if(actionTxt) g.actions.add(actionTxt);
    });
  });
  const out = Object.values(groups).map(g => ({
    mins: g.mins,
    count: g.count,
    prob: g.prob,
    type: g.type,
    when: g.lastWhen,
    src: g.lastSrc,
    action: Array.from(g.actions).slice(0,2).join(' · '),
  }));
  out.sort((a,b)=>b.mins-a.mins);
  return out.slice(0,12);
}

// Split downtime totals by type for the panel summary cards
function downtimeByType(rows){
  const deduped = dedupShiftRows(rows);
  const out = {mech:{mins:0, count:0}, prod:{mins:0, count:0}, unknown:{mins:0, count:0}};
  deduped.forEach(r => {
    if(r.src.kind!=='shift') return;
    const events = r.row.downtime_events;
    if(!Array.isArray(events)) return;
    events.forEach(ev => {
      const mins = parseFloat(ev.mins);
      if(isNaN(mins)||mins<=0) return;
      const type = ev.type || (ev.prob ? 'mech' : 'unknown');
      const bucket = (type === 'mech' || type === 'prod') ? type : 'unknown';
      out[bucket].mins += mins;
      out[bucket].count += 1;
    });
  });
  return out;
}

// ── WIP HEATMAP ───────────────────────────────────────────────────────────────
// Builds a {dayKey: {hour: {sum, count}}} structure averaged across reports.
// `lineFilter` = 'all' | 'pott' | 'wav' | 'car'
function buildWipBuckets(rows, lineFilter){
  // Aggregate WIP buckets [6am, 2pm, 10pm] from reports submitted in the last 24 hours,
  // grouped by area + line. Each input report has wip_hourly = [v6am, v2pm, v10pm].
  // RULE: only keep the most recent report per (area + line + shift) to avoid
  // double-counting corrected/duplicate submissions.
  const cutoff = Date.now() - 24*60*60*1000;
  const areaMap = SHIFT_KEY_TO_LABEL;

  // Step 1: filter + dedupe (rows are pre-sorted DESC by submitted_at)
  const seen = new Set();
  const kept = [];
  rows.forEach(r => {
    if(r.src.kind !== 'shift') return;
    if(lineFilter !== 'all' && r.src.line !== lineFilter) return;
    const submitted = new Date(r.row.submitted_at).getTime();
    if(isNaN(submitted) || submitted < cutoff) return;
    if(!Array.isArray(r.row.wip_hourly)) return;
    const area = areaMap[r.src.key];
    if(!area) return;
    const line = (String(r.row.line || '').trim()) || '—';
    const dedupeKey = `${area}|${line}|${r.row.shift}`;
    if(seen.has(dedupeKey)) return;
    seen.add(dedupeKey);
    kept.push({r, area, line});
  });

  // Step 2: build groups keyed by area+line
  const groups = {};
  kept.forEach(({r, area, line}) => {
    const key = area + '|' + line;
    if(!groups[key]){
      groups[key] = {
        area, line,
        buckets: {
          '6am':  {sum:0, count:0},
          '2pm':  {sum:0, count:0},
          '10pm': {sum:0, count:0},
        },
        reportCount: 0,
      };
    }
    const g = groups[key];
    g.reportCount++;
    const keys = ['6am','2pm','10pm'];
    for(let i=0; i<3 && i<r.row.wip_hourly.length; i++){
      const v = parseFloat(r.row.wip_hourly[i]);
      if(isNaN(v)) continue;
      const b = g.buckets[keys[i]];
      b.sum += v;
      b.count += 1;
    }
  });

  // Step 3: sort area then line (matching production-flow order)
  const areaOrder = {'Carousel':0, 'Potting':1, 'Wave-3':2};
  const arr = Object.values(groups).sort((a,b) => {
    const ao = areaOrder[a.area] ?? 99;
    const bo = areaOrder[b.area] ?? 99;
    if(ao !== bo) return ao - bo;
    if(a.line === '—' && b.line !== '—') return 1;
    if(b.line === '—' && a.line !== '—') return -1;
    return a.line.localeCompare(b.line, undefined, {numeric:true});
  });

  return {rows: arr, anyData: arr.length > 0};
}

// ── UPH BOARD (24hr Production by Line) ──────────────────────────────────────
// Maps each shift's 8 production_hrs slots → real clock hours, then aggregates
// per (area + line) combination across all reports in range.
//
// Standard 3-shift manufacturing schedule:
//   Shift A: 6 AM – 2 PM   (slot 1 = 6:00, slot 8 = 13:00)
//   Shift B: 2 PM – 10 PM  (slot 1 = 14:00, slot 8 = 21:00)
//   Shift C: 10 PM – 6 AM  (slot 1 = 22:00, slot 8 = 5:00)
function shiftStartHour(shift){
  const s = String(shift||'').trim().toUpperCase();
  if(s.startsWith('A')) return 6;
  if(s.startsWith('B')) return 14;
  if(s.startsWith('C')) return 22;
  return null;
}

function buildUphBoard(rows){
  // Map: "area|line" → { area, line, hours: [24], total }
  // RULE: only one shift report per (area + line + shift) — keep the MOST RECENT.
  // This prevents double-counting when a tech submits a corrected report.
  const cutoff = Date.now() - 24*60*60*1000;

  // Step 1: filter to last 24h shift reports + dedupe by (area, line, shift)
  // Reports are sorted DESC by submitted_at upstream, so the first one we see for a key wins.
  const seen = new Set();
  const kept = [];
  rows.forEach(r => {
    if(r.src.kind !== 'shift') return;
    const submitted = new Date(r.row.submitted_at).getTime();
    if(isNaN(submitted) || submitted < cutoff) return;
    if(!Array.isArray(r.row.production_hrs)) return;
    if(shiftStartHour(r.row.shift) === null) return;
    const areaMap = SHIFT_KEY_TO_LABEL;
    const area = areaMap[r.src.key];
    if(!area) return;
    const line = (String(r.row.line || '').trim()) || '—';
    const dedupeKey = `${area}|${line}|${r.row.shift}`;
    if(seen.has(dedupeKey)) return;  // older duplicate, skip
    seen.add(dedupeKey);
    kept.push({r, area, line, submitted});
  });

  // Step 2: aggregate the kept reports into the area+line groups
  const groups = {};
  kept.forEach(({r, area, line}) => {
    const startHour = shiftStartHour(r.row.shift);
    const key = area + '|' + line;
    if(!groups[key]){
      groups[key] = {
        area, line,
        hours: Array(24).fill(0),
        cellCount: Array(24).fill(0),
        total: 0,
        reportCount: 0,
      };
    }
    const g = groups[key];
    g.reportCount++;
    for(let i = 0; i < 8 && i < r.row.production_hrs.length; i++){
      const v = parseFloat(r.row.production_hrs[i]);
      if(isNaN(v)) continue;
      const hour = (startHour + i) % 24;
      g.hours[hour] += v;
      g.cellCount[hour]++;
      g.total += v;
    }
  });
  // Convert to sorted array — group by area, then by line
  const areaOrder = {'Carousel':0, 'Potting':1, 'Wave-3':2};
  const arr = Object.values(groups).sort((a,b) => {
    const aOrder = areaOrder[a.area] ?? 99;
    const bOrder = areaOrder[b.area] ?? 99;
    if(aOrder !== bOrder) return aOrder - bOrder;
    // Lines: numeric first, then "—" (Unknown) last
    if(a.line === '—' && b.line !== '—') return 1;
    if(b.line === '—' && a.line !== '—') return -1;
    return a.line.localeCompare(b.line, undefined, {numeric:true});
  });
  // Find global max for color scaling
  let max = 0;
  arr.forEach(g => g.hours.forEach(v => { if(v > max) max = v; }));
  return { rows: arr, max };
}


function scoutSummary(rows){
  const summary = {};  // {sourceKey: {reports, attnTotal, covered:Set}}
  ['scout-car','scout-wav','scout-pott'].forEach(k => summary[k] = {reports:0, attnTotal:0, covered:new Set()});
  // Map scout-* source keys → MACHINE_INVENTORY area keys for coverage lookup
  const scoutToArea = {'scout-car':'car', 'scout-wav':'wav', 'scout-pott':'pott'};
  rows.forEach(r => {
    if(r.src.kind!=='scout') return;
    const s = summary[r.src.key];
    if(!s) return;
    s.reports++;
    s.attnTotal += scoutAttnLive(r.row);  // live recompute, handles edited reports
    // Track unique lines covered for coverage statistics
    const areaKey = scoutToArea[r.src.key];
    const ln = normalizeLine(r.row.line);
    if(ln && areaKey && MACHINE_INVENTORY[areaKey]?.lines.includes(ln)){
      s.covered.add(ln);
    }
  });
  // Stash inventory lookup on the summary for the renderer
  summary.__inventoryFor = {
    'scout-car':  MACHINE_INVENTORY.car,
    'scout-pott': MACHINE_INVENTORY.pott,
    'scout-wav':  MACHINE_INVENTORY.wav,
  };
  return summary;
}

// ── REPORTS BY TECHNICIAN ─────────────────────────────────────────────────────
function techCounts(rows){
  // {techName: {total, byKey, lastWhen, uphSum, uphCount, scoutFlags, days}}
  const map = {};
  rows.forEach(r => {
    let name = (r.row.tech || r.row.tech_name || '').trim();
    if(!name) name = 'Unknown';
    if(!map[name]) map[name] = {
      total:0, byKey:{}, lastWhen:null,
      uphSum:0, uphCount:0,
      scoutFlags:0, scoutReports:0,
      days: new Set(),  // unique calendar days they submitted on (for streak calc)
    };
    map[name].total++;
    map[name].byKey[r.src.key] = (map[name].byKey[r.src.key]||0) + 1;
    if(!map[name].lastWhen || new Date(r.when) > new Date(map[name].lastWhen)){
      map[name].lastWhen = r.when;
    }
    // Track unique submission day (local) for streak detection
    const t = new Date(r.when);
    if(!isNaN(t.getTime())){
      const dayKey = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
      map[name].days.add(dayKey);
    }
    if(r.src.kind === 'shift'){
      const p = parseFloat(r.row.production_total);
      if(!isNaN(p) && p > 0){ map[name].uphSum += p; map[name].uphCount++; }
    }
    if(r.src.kind === 'scout'){
      map[name].scoutReports++;
      map[name].scoutFlags += scoutAttnLive(r.row);
    }
  });
  return Object.entries(map)
    .map(([name, d]) => ({
      name,
      ...d,
      avgUph: d.uphCount > 0 ? Math.round(d.uphSum / d.uphCount) : null,
      avgFlagsPerScout: d.scoutReports > 0 ? Math.round((d.scoutFlags / d.scoutReports) * 10) / 10 : null,
      streak: computeStreak(d.days),
    }))
    .sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
}

// Compute the longest CURRENT streak (consecutive calendar days ending at the
// most recent submission) from a set of date keys (YYYY-MM-DD strings).
// Example: techs who submitted Mon, Tue, Wed → streak = 3.
// A gap day breaks the streak. Today not yet submitted? Streak ends yesterday.
function computeStreak(daySet){
  if(!(daySet instanceof Set) || daySet.size === 0) return 0;
  // Sort days descending so we walk backwards from most recent
  const days = Array.from(daySet).sort().reverse();
  let streak = 1;
  let prev = new Date(days[0] + 'T00:00:00');
  for(let i = 1; i < days.length; i++){
    const cur = new Date(days[i] + 'T00:00:00');
    const diffDays = Math.round((prev - cur) / 86400000);
    if(diffDays === 1){
      streak++;
      prev = cur;
    } else {
      break;
    }
  }
  return streak;
}

function recentFlags(rows){
  // dig into sections[].flaggedItems for each scout report
  const out = [];
  rows.forEach(r => {
    if(r.src.kind!=='scout') return;
    const secs = r.row.sections;
    if(!Array.isArray(secs)) return;
    secs.forEach(sec => {
      const flagged = sec.flaggedItems;
      if(!Array.isArray(flagged)) return;
      flagged.forEach(fi => {
        out.push({
          when: r.when,
          src: r.src,
          tech: r.row.tech || 'Unknown',
          line: r.row.line || '—',
          secNum: sec.num,
          secTitle: sec.title,
          item: fi.item,
          note: fi.note || '',
        });
      });
    });
  });
  out.sort((a,b)=> new Date(b.when) - new Date(a.when));
  return out;  // No cap — caller decides how many to show
}

// ── RECENT FEED ────────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════
// PM ACTIVITY PANEL
// ═══════════════════════════════════════════════════════════════════════════
// Aggregates all PM (preventive maintenance) reports across the 3 areas:
// - per-area volume + total task health (OK / Attn / N/A breakdown)
// - flag-resolution efficacy (resolved vs pending across the period)
// - top 5 tasks that triggered "needs attention" most often
// - latest submitted PM report per area (so we can spot lapsed maintenance)
// ═══════════════════════════════════════════════════════════════════════════
// OEE SUMMARY — Overall Equipment Effectiveness (Availability × Performance × Quality)
// Industry-standard manufacturing metric. Computed approximately from shift reports.
// Heuristic assumptions documented inline since we don't have explicit cycle-time targets.
// ═══════════════════════════════════════════════════════════════════════════

function buildOeeStats(rows){
  const deduped = dedupShiftRows(rows.filter(r => r.src.kind === 'shift'));
  const PLANNED_MINS_PER_SHIFT = 480;  // 8h shift baseline
  const areaUph = getAreaUphTargets();  // {car, pott, wav, bat, iq9} — per-area targets
  let plannedMins = 0, downtimeMins = 0, production = 0, scrap = 0, shiftCount = 0;
  // Theoretical output is summed per-row using that row's area target, since
  // Battery/IQ9 run a much lower UPH than the traditional lines.
  let theoreticalTotal = 0;
  const byArea = {
    Carousel:{a:0,p:0,q:0,n:0}, Potting:{a:0,p:0,q:0,n:0}, 'Wave-3':{a:0,p:0,q:0,n:0},
    Battery:{a:0,p:0,q:0,n:0}, IQ9:{a:0,p:0,q:0,n:0},
  };
  const areaMap = {
    'shift-pott':'Potting','shift-wav':'Wave-3','shift-car':'Carousel',
    'shift-bat':'Battery','shift-iq9':'IQ9',
  };

  deduped.forEach(r => {
    shiftCount++;
    let dt = 0;
    (r.row.downtime_events || []).forEach(ev => {
      const m = parseFloat(ev.mins);
      if(!isNaN(m) && m > 0) dt += m;
    });
    const prod = parseFloat(r.row.production_total) || 0;
    const sc = (parseFloat(r.row.scrap_qty) || 0)
             + (parseFloat(r.row.this_overflow) || 0)
             + (parseFloat(r.row.this_crashed) || 0)
             + (parseFloat(r.row.this_mes) || 0)
             + (parseFloat(r.row.this_other) || 0);

    plannedMins += PLANNED_MINS_PER_SHIFT;
    downtimeMins += dt;
    production += prod;
    scrap += sc;

    // Look up this row's UPH target by area (defaults to 60 if unknown)
    const areaCode = SHIFT_KEY_TO_AREA[r.src.key] || 'car';
    const rowTargetUph = areaUph[areaCode] || 60;
    const rowRunMins = Math.max(0, PLANNED_MINS_PER_SHIFT - dt);
    theoreticalTotal += (rowRunMins / 60) * rowTargetUph;

    const a = byArea[areaMap[r.src.key]];
    if(a){
      const avail = PLANNED_MINS_PER_SHIFT > 0 ? rowRunMins / PLANNED_MINS_PER_SHIFT : 0;
      const goodOutput = Math.max(0, prod - sc);
      const qual = prod > 0 ? goodOutput / prod : 1;
      const theoretical = (rowRunMins / 60) * rowTargetUph;
      const perf = theoretical > 0 ? Math.min(1, prod / theoretical) : 0;
      a.a += avail; a.p += perf; a.q += qual; a.n += 1;
    }
  });

  const runMins = Math.max(0, plannedMins - downtimeMins);
  const availability = plannedMins > 0 ? runMins / plannedMins : 0;
  const goodOutput = Math.max(0, production - scrap);
  const quality = production > 0 ? goodOutput / production : 1;
  // Overall performance uses the per-area theoretical sum, so a slow day on
  // Battery doesn't unfairly tank the plant-wide number.
  const performance = theoreticalTotal > 0 ? Math.min(1, production / theoreticalTotal) : 0;
  const oee = availability * performance * quality;

  return {
    availability, performance, quality, oee,
    runMins, plannedMins, downtimeMins,
    production, scrap, goodOutput, shiftCount,
    byArea: Object.fromEntries(Object.entries(byArea).map(([k,v]) => [k, {
      availability: v.n > 0 ? v.a / v.n : 0,
      performance:  v.n > 0 ? v.p / v.n : 0,
      quality:      v.n > 0 ? v.q / v.n : 0,
      oee:          v.n > 0 ? (v.a / v.n) * (v.p / v.n) * (v.q / v.n) : 0,
      shifts: v.n,
    }])),
  };
}

          </div>

        <div class="oee-formula-note">
          <strong>Formula:</strong> Availability = run time ÷ planned time · Performance = actual output ÷ theoretical output (per-area UPH target) · Quality = good units ÷ total units
        </div>
      </div>
    </div>`;
}

// Apply an edited per-area UPH target and re-render
window.applyAreaUph = function(areaCode){

// ═══════════════════════════════════════════════════════════════════════════
// PARETO ANALYSIS — top X causes contributing to Y% of downtime (80/20 rule)
// Sorts downtime causes by impact and shows cumulative percentage curve.
// Surfaces the few causes responsible for most of the loss — classic root-cause tool.
// ═══════════════════════════════════════════════════════════════════════════
function buildPareto(rows){
  const deduped = dedupShiftRows(rows.filter(r => r.src.kind === 'shift'));
  const groups = {};  // {key: {label, type, mins, count, areas: Set}}
  deduped.forEach(r => {
    const events = r.row.downtime_events;
    if(!Array.isArray(events)) return;
    events.forEach(ev => {
      const mins = parseFloat(ev.mins);
      if(isNaN(mins) || mins <= 0) return;
      const type = ev.type || (ev.prob ? 'mech' : 'unknown');
      const label = type === 'prod' ? (ev.cause || ev.prob || 'Unknown cause') : (ev.prob || 'Unknown problem');
      const key = (type + '||' + label).toLowerCase().replace(/\s+/g, ' ').trim();
      if(!groups[key]){
        groups[key] = {label: label.trim(), type, mins:0, count:0, areas:new Set()};
      }
      groups[key].mins += mins;
      groups[key].count += 1;
      const areaMap = SHIFT_KEY_TO_LABEL;
      const area = areaMap[r.src.key];
      if(area) groups[key].areas.add(area);
    });
  });
  const sorted = Object.values(groups)
    .map(g => ({...g, areas: Array.from(g.areas)}))
    .sort((a, b) => b.mins - a.mins);
  const totalMins = sorted.reduce((s, g) => s + g.mins, 0);
  let cumulative = 0;
  sorted.forEach(g => {
    cumulative += g.mins;
    g.cumPct = totalMins > 0 ? (cumulative / totalMins) * 100 : 0;
    g.pct = totalMins > 0 ? (g.mins / totalMins) * 100 : 0;
  });
  // Find the index that crosses 80% — the "vital few"
  let vitalFewCt = 0;
  for(const g of sorted){
    vitalFewCt++;
    if(g.cumPct >= 80) break;
  }
  return {causes: sorted.slice(0, 15), totalMins, vitalFewCt, totalCauses: sorted.length};
}

function renderPareto(p){
  if(p.causes.length === 0){
    return `
      <div class="panel" data-panel-key="pareto">
        <div class="panel-head">
          <h2>Pareto — Vital Few Loss Drivers</h2>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            ${renderPanelRangeBadge('pareto')}
            <span class="panel-meta">no losses in range</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="empty"><div class="empty-icon">📉</div>No downtime events to analyze.</div>
        </div>
      </div>`;
  }
  // Read view preference from localStorage so it persists across renders
  const view = (localStorage.getItem('salcomp_pareto_view') || 'table');
  const max = Math.max(...p.causes.map(c => c.mins));

  // ── TABLE VIEW (info-dense) ────────────────────────────────────────────
  const tableRows = p.causes.map((c, i) => {
    const widthPct = (c.mins / max) * 100;
    const isVitalFew = i < p.vitalFewCt;
    const pillCls = c.type === 'mech' ? 'dt-pill-mech' : c.type === 'prod' ? 'dt-pill-prod' : 'dt-pill-unk';
    const pillTxt = c.type === 'mech' ? '⚙' : c.type === 'prod' ? '📦' : '—';
    return `
      <div class="pareto-row ${isVitalFew?'pareto-vital':''}">
        <div class="pareto-rank">${i + 1}</div>
        <div class="pareto-label">
          <span class="pareto-type ${pillCls}">${pillTxt}</span>
          ${escapeHtml(c.label)}
          <span class="pareto-meta">${c.count}× · ${c.areas.join(', ') || '—'}</span>
        </div>
        <div class="pareto-bar"><div class="pareto-bar-fill" style="width:${widthPct}%"></div></div>
        <div class="pareto-mins">${Math.round(c.mins)} min</div>
        <div class="pareto-cum">${Math.round(c.cumPct)}%</div>
      </div>`;
  }).join('');
  const tableHtml = `
    <div class="pareto-header">
      <div class="pareto-rank-h">#</div>
      <div class="pareto-label-h">Cause</div>
      <div class="pareto-bar-h">Impact</div>
      <div class="pareto-mins-h">Mins</div>
      <div class="pareto-cum-h">Cum %</div>
    </div>
    <div class="pareto-list">${tableRows}</div>`;

  // ── CHART VIEW (classic Pareto: bars + cumulative line) ────────────────
  // SVG dimensions
  const chartCauses = p.causes;  // already top 15
  const N = chartCauses.length;
  const w = Math.max(560, N * 56);   // grow horizontally for many bars
  const h = 360;
  const padL = 50, padR = 50, padT = 20, padB = 110;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const barGap = 8;
  const barW = (plotW / N) - barGap;

  // Bars (mins)
  const bars = chartCauses.map((c, i) => {
    const x = padL + i * (plotW / N) + barGap/2;
    const barH = (c.mins / max) * plotH;
    const y = padT + (plotH - barH);
    const isVital = i < p.vitalFewCt;
    const fill = isVital ? 'var(--amb)' : 'var(--red)';
    return `
      <g>
        <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3"
          fill="${fill}" fill-opacity="${isVital ? 0.85 : 0.6}"
          stroke="${fill}" stroke-width="1">
          <title>${escapeHtml(c.label)} — ${Math.round(c.mins)} min (${Math.round(c.pct)}%)</title>
        </rect>
        <text x="${x + barW/2}" y="${y - 4}" text-anchor="middle"
          fill="var(--mut)" font-family="'IBM Plex Mono', monospace" font-size="9.5">${Math.round(c.mins)}</text>
      </g>`;
  }).join('');

  // Cumulative % line (right-axis)
  const linePoints = chartCauses.map((c, i) => {
    const x = padL + i * (plotW / N) + (plotW / N) / 2;
    const y = padT + plotH - (c.cumPct / 100) * plotH;
    return `${x},${y}`;
  }).join(' ');
  const lineDots = chartCauses.map((c, i) => {
    const x = padL + i * (plotW / N) + (plotW / N) / 2;
    const y = padT + plotH - (c.cumPct / 100) * plotH;
    return `<circle cx="${x}" cy="${y}" r="3" fill="var(--cyn)" stroke="var(--bg)" stroke-width="1.5">
      <title>Cumulative ${Math.round(c.cumPct)}%</title></circle>`;
  }).join('');

  // 80% reference line
  const eightyY = padT + plotH - (80 / 100) * plotH;

  // X-axis labels (rotated, truncated)
  const xLabels = chartCauses.map((c, i) => {
    const x = padL + i * (plotW / N) + (plotW / N) / 2;
    const label = c.label.length > 18 ? c.label.slice(0, 16) + '…' : c.label;
    const isVital = i < p.vitalFewCt;
    return `<text x="${x}" y="${padT + plotH + 12}" text-anchor="end"
      transform="rotate(-45 ${x} ${padT + plotH + 12})"
      fill="${isVital ? 'var(--amb)' : 'var(--mut2)'}"
      font-family="'IBM Plex Sans', sans-serif" font-size="10"
      font-weight="${isVital ? 600 : 400}">${escapeHtml(label)}</text>`;
  }).join('');

  // Y-axis ticks (left = mins, right = %)
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => {
    const y = padT + plotH - t * plotH;
    return `
      <line x1="${padL}" y1="${y}" x2="${padL + plotW}" y2="${y}"
        stroke="var(--bdr)" stroke-width="1" stroke-dasharray="${t === 0 ? '' : '2,3'}"/>
      <text x="${padL - 6}" y="${y + 3}" text-anchor="end"
        fill="var(--mut2)" font-family="'IBM Plex Mono', monospace" font-size="9">${Math.round(max * t)}</text>
      <text x="${padL + plotW + 6}" y="${y + 3}" text-anchor="start"
        fill="var(--mut2)" font-family="'IBM Plex Mono', monospace" font-size="9">${Math.round(t * 100)}%</text>`;
  }).join('');

  const chartHtml = `
    <div class="pareto-chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" class="pareto-chart">
        ${yTicks}
        ${bars}
        <line x1="${padL}" y1="${eightyY}" x2="${padL + plotW}" y2="${eightyY}"
          stroke="var(--amb)" stroke-width="1" stroke-dasharray="4,4" opacity=".6"/>
        <text x="${padL + plotW + 4}" y="${eightyY - 4}" fill="var(--amb)"
          font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">80%</text>
        <polyline points="${linePoints}" fill="none" stroke="var(--cyn)"
          stroke-width="2" stroke-linejoin="round"/>
        ${lineDots}
        ${xLabels}
        <text x="${padL - 38}" y="${padT + plotH/2}" text-anchor="middle"
          transform="rotate(-90 ${padL - 38} ${padT + plotH/2})"
          fill="var(--mut)" font-family="'IBM Plex Mono', monospace" font-size="10"
          letter-spacing=".06em" text-transform="uppercase">Minutes Lost</text>
        <text x="${padL + plotW + 30}" y="${padT + plotH/2}" text-anchor="middle"
          transform="rotate(90 ${padL + plotW + 30} ${padT + plotH/2})"
          fill="var(--mut)" font-family="'IBM Plex Mono', monospace" font-size="10"
          letter-spacing=".06em" text-transform="uppercase">Cumulative %</text>
      </svg>
      <div class="pareto-chart-legend">
        <span><i class="legend-sw" style="background:var(--amb);"></i> Vital few (causes ≥80% of loss)</span>
        <span><i class="legend-sw" style="background:var(--red);opacity:.6;"></i> Trivial many</span>
        <span><i class="legend-sw legend-line"></i> Cumulative %</span>
      </div>
    </div>`;

  return `
    <div class="panel" data-panel-key="pareto">
      <div class="panel-head">
        <h2>Pareto — Vital Few Loss Drivers</h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${renderPanelRangeBadge('pareto')}
          <span class="panel-meta">${p.vitalFewCt} of ${p.totalCauses} causes drive 80% of loss · ${Math.round(p.totalMins)} total min</span>
          <div class="pareto-view-toggle">
            <button class="pview-btn ${view==='table'?'active':''}" onclick="setParetoView('table')" title="Table view">☰ Table</button>
            <button class="pview-btn ${view==='chart'?'active':''}" onclick="setParetoView('chart')" title="Pareto chart view">📊 Chart</button>
          </div>
        </div>
      </div>
      <div class="panel-body">
        ${view === 'chart' ? chartHtml : tableHtml}
        <div class="pareto-footnote">${view === 'chart'
          ? 'Bars = minutes lost per cause. Line = cumulative % of total loss. Bars left of where the line crosses 80% are the vital few — fix those first.'
          : 'Highlighted rows are the "vital few" — addressing these closes 80% of the gap (Pareto principle).'
        }</div>
      </div>
    </div>`;
}

window.setParetoView = function(view){
  try { localStorage.setItem('salcomp_pareto_view', view); } catch(e){}
  if(typeof render === 'function') render();
};

// ── MACHINE INVENTORY ─────────────────────────────────────────────────────────
// The plant has 16 production machines that need weekly PM + scout checks.
// Coverage = how many of these unique machines have been PM'd/scouted in the
// selected period. Helps engineers see which lines still need attention.
const MACHINE_INVENTORY = {
  car:  { label:'Carousel', lines:['1','2','3','6','7']           },  // 5 machines
  pott: { label:'Potting',  lines:['1','2','3','6','7','7.5']     },  // 6 machines
  wav:  { label:'Wave-3',   lines:['1','2','3','6','7']           },  // 5 machines
};
const TOTAL_MACHINES = Object.values(MACHINE_INVENTORY)
  .reduce((sum, a) => sum + a.lines.length, 0);  // = 16

// Normalize line strings for comparison (e.g. "7.5", " 7.5 ", "Line 7.5", 7.5)
function normalizeLine(raw){
  if(raw == null) return '';
  return String(raw).replace(/line\s*/i, '').trim();
}

function pmStats(rows){
  const pmRows = rows.filter(r => r.src.kind === 'pm');
  // Map area names → our internal short keys
  const areaKey = (a) => {
    const s = String(a||'').toLowerCase();
    if(s.includes('carousel')) return 'car';
    if(s.includes('potting'))  return 'pott';
    if(s.includes('wave'))     return 'wav';
    return 'other';
  };
  const areaLabel = {car:'Carousel', pott:'Potting', wav:'Wave-3', other:'Other'};
  const areaColor = {car:'#a371f7', pott:'#3fb950', wav:'#388bfd', other:'#6e7681'};

  const stats = {
    total: pmRows.length,
    okAll: 0, attnAll: 0, naAll: 0,
    pendingAll: 0, resolvedAll: 0,
    byArea: {car:null, pott:null, wav:null},
    topAttn: {},   // {taskText: count}
    latestByArea: {car:null, pott:null, wav:null},
    coveredByArea: {car:new Set(), pott:new Set(), wav:new Set()},
  };

  pmRows.forEach(r => {
    const ak = areaKey(r.row.area);
    if(!stats.byArea[ak]){
      stats.byArea[ak] = {label: areaLabel[ak] || ak, color: areaColor[ak], count:0, ok:0, attn:0, na:0, pending:0, resolved:0};
    }
    const a = stats.byArea[ak];
    a.count++;
    // Track which line this PM covered for coverage stats
    const ln = normalizeLine(r.row.line);
    if(ln && stats.coveredByArea[ak] && MACHINE_INVENTORY[ak]?.lines.includes(ln)){
      stats.coveredByArea[ak].add(ln);
    }
    const tasks = Array.isArray(r.row.weekly_tasks) ? r.row.weekly_tasks : [];
    tasks.forEach(t => {
      if(t.state === 'ok')   { a.ok++;   stats.okAll++; }
      if(t.state === 'attn') {
        a.attn++; stats.attnAll++;
        const txt = (t.text || '').trim();
        if(txt) stats.topAttn[txt] = (stats.topAttn[txt]||0) + 1;
      }
      if(t.state === 'na')   { a.na++;   stats.naAll++; }
    });
    a.pending  += parseInt(r.row.pending_count)  || 0;
    a.resolved += parseInt(r.row.resolved_count) || 0;
    stats.pendingAll  += parseInt(r.row.pending_count)  || 0;
    stats.resolvedAll += parseInt(r.row.resolved_count) || 0;

    // Track most recent PM per area
    const submittedAt = r.when ? new Date(r.when).getTime() : 0;
    if(stats.byArea[ak] && (!stats.latestByArea[ak] || submittedAt > stats.latestByArea[ak].t)){
      stats.latestByArea[ak] = { t:submittedAt, tech:r.row.tech_name||'Unknown', date:r.date||'—', line:r.row.line||'?', id:r.row.id };
    }
  });

  // Coverage summary across all areas
  const coveredTotal = stats.coveredByArea.car.size
                     + stats.coveredByArea.pott.size
                     + stats.coveredByArea.wav.size;
  stats.coverage = {
    covered: coveredTotal,
    total: TOTAL_MACHINES,
    pct: TOTAL_MACHINES > 0 ? Math.round((coveredTotal / TOTAL_MACHINES) * 100) : 0,
  };

  // Top 5 attn tasks sorted by count
  stats.topAttnList = Object.entries(stats.topAttn)
    .map(([text, count]) => ({text, count}))
    .sort((a,b) => b.count - a.count)
    .slice(0, 5);

  return stats;
}

function renderPmActivity(s){
  const hasData = s.total > 0;
  const totalTasks = s.okAll + s.attnAll + s.naAll;
  const pctOk   = totalTasks > 0 ? Math.round(s.okAll  /totalTasks*100) : 0;
  const pctAttn = totalTasks > 0 ? Math.round(s.attnAll/totalTasks*100) : 0;
  const pctNa   = totalTasks > 0 ? Math.round(s.naAll  /totalTasks*100) : 0;
  // Resolution rate
  const totalFlagsHandled = s.pendingAll;
  const resolutionRate = totalFlagsHandled > 0 ? Math.round((s.resolvedAll/totalFlagsHandled)*100) : null;

  const areaCards = ['car','pott','wav'].map(ak => {
    const a = s.byArea[ak];
    const inv = MACHINE_INVENTORY[ak];
    const label = inv.label;
    const color = {car:'#a371f7', pott:'#3fb950', wav:'#388bfd'}[ak];
    const latest = s.latestByArea[ak];
    const covered = s.coveredByArea[ak];
    const missing = inv.lines.filter(ln => !covered.has(ln));
    const coveragePct = Math.round((covered.size / inv.lines.length) * 100);
    const covColor = coveragePct === 100 ? 'var(--grn)' : coveragePct >= 50 ? 'var(--amb)' : 'var(--red)';

    if(!a){
      return `
        <div class="pm-area-card pm-empty">
          <div class="pm-area-hd"><span class="pm-area-dot" style="background:${color}"></span>${label}</div>
          <div class="pm-coverage pm-coverage-empty">
            <div class="pm-cov-bar"><div class="pm-cov-fill" style="width:0%;background:var(--red)"></div></div>
            <div class="pm-cov-row">
              <span class="pm-cov-pct" style="color:var(--red)">0 / ${inv.lines.length}</span>
              <span class="pm-cov-meta">${t('pm.no_in_range')}</span>
            </div>
            <div class="pm-cov-missing">
              <span class="pm-cov-missing-lbl">Pending:</span>
              ${inv.lines.map(ln => `<span class="pm-cov-chip pm-cov-chip-missing">Line ${escapeHtml(ln)}</span>`).join('')}
            </div>
          </div>
        </div>`;
    }
    const aTotal = a.ok + a.attn + a.na;
    const aPctOk = aTotal > 0 ? Math.round(a.ok/aTotal*100) : 0;
    const aPctAttn = aTotal > 0 ? Math.round(a.attn/aTotal*100) : 0;
    const aPctNa = aTotal > 0 ? Math.round(a.na/aTotal*100) : 0;
    const aResRate = a.pending > 0 ? Math.round((a.resolved/a.pending)*100) : null;
    const lastSubmittedRel = latest ? relTime(new Date(latest.t).toISOString()) : '—';
    return `
      <div class="pm-area-card">
        <div class="pm-area-hd">
          <span class="pm-area-dot" style="background:${color}"></span>
          <span>${label}</span>
          <span class="pm-area-count">${a.count} ${a.count===1?t('pm.report'):t('pm.reports')}</span>
        </div>
        <div class="pm-coverage">
          <div class="pm-cov-bar"><div class="pm-cov-fill" style="width:${coveragePct}%;background:${covColor}"></div></div>
          <div class="pm-cov-row">
            <span class="pm-cov-pct" style="color:${covColor}">${covered.size} / ${inv.lines.length} machines PM'd</span>
            <span class="pm-cov-meta">${coveragePct}% coverage</span>
          </div>
          <div class="pm-cov-missing">
            ${inv.lines.map(ln => {
              const done = covered.has(ln);
              return `<span class="pm-cov-chip ${done?'pm-cov-chip-done':'pm-cov-chip-missing'}" title="Line ${escapeHtml(ln)} — ${done?'PM submitted in range':'No PM yet'}">${done?'✓':'○'} ${escapeHtml(ln)}</span>`;
            }).join('')}
          </div>
        </div>
        <div class="pm-bar">
          <div class="pm-bar-seg pm-seg-ok"   style="width:${aPctOk}%"  title="${a.ok} OK (${aPctOk}%)"></div>
          <div class="pm-bar-seg pm-seg-attn" style="width:${aPctAttn}%" title="${a.attn} need attention (${aPctAttn}%)"></div>
          <div class="pm-bar-seg pm-seg-na"   style="width:${aPctNa}%"  title="${a.na} N/A (${aPctNa}%)"></div>
        </div>
        <div class="pm-bar-legend">
          <span class="pm-leg-ok">${a.ok} ✓</span>
          <span class="pm-leg-attn">${a.attn} ⚠</span>
          <span class="pm-leg-na">${a.na} —</span>
        </div>
        <div class="pm-meta-row">
          <div>
            <div class="pm-meta-lbl">${t('pm.flag_resolution')}</div>
            <div class="pm-meta-val">${aResRate==null ? '—' : aResRate+'%'}<span class="pm-meta-sub">${a.resolved}/${a.pending}</span></div>
          </div>
          <div>
            <div class="pm-meta-lbl">${t('pm.last_submitted')}</div>
            <div class="pm-meta-val pm-meta-val-sm">${lastSubmittedRel}</div>
            ${latest ? `<div class="pm-meta-sub">by ${escapeHtml(latest.tech)}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  const topAttnHtml = s.topAttnList.length === 0
    ? `<div class="empty" style="padding:20px 10px;font-size:11px;"><div class="empty-icon" style="font-size:18px;margin-bottom:4px">✓</div>No tasks flagged in this period</div>`
    : s.topAttnList.map(t => `
        <div class="pm-attn-row">
          <div class="pm-attn-text" title="${escapeHtml(t.text)}">${escapeHtml(t.text)}</div>
          <div class="pm-attn-count">${t.count}×</div>
        </div>
      `).join('');

  return `
    <div class="panel" data-panel-key="pm">
      <div class="panel-head">
        <h2><a class="panel-head-link" href="Analytics_Detail.html?subject=pm" onclick="event.stopPropagation()" title="Open detail page">${t('analytics.panel.pm') || 'PM Activity — Weekly Maintenance'}<span class="panel-head-arrow">→</span></a></h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${renderPanelRangeBadge('pm')}
          <span class="panel-meta">${s.total} PM ${s.total===1?t('pm.report'):t('pm.reports')}</span>
          ${(() => {
            const cov = s.coverage;
            const cls = cov.pct === 100 ? 'pm-cov-badge-good' : cov.pct >= 50 ? 'pm-cov-badge-mid' : 'pm-cov-badge-low';
            return `<span class="pm-cov-badge ${cls}" title="${cov.covered} of ${cov.total} machines PM'd in this period">${cov.covered}/${cov.total} machines covered · ${cov.pct}%</span>`;
          })()}
          ${resolutionRate != null ? `<span class="pm-resolution-badge">${t('pm.flag_resolution')} ${resolutionRate}% (${s.resolvedAll}/${s.pendingAll})</span>` : ''}
        </div>
      </div>
      <div class="panel-body">
        ${hasData ? `
          <div class="pm-grid">
            <div class="pm-areas">${areaCards}</div>
            <div class="pm-attn-block">
              <div class="pm-attn-hd">${t('pm.top_recurring')}</div>
              <div class="pm-attn-sub">${t('pm.top_recurring_sub')}</div>
              <div class="pm-attn-list">${topAttnHtml}</div>
            </div>
          </div>
          <div class="pm-overall-bar-wrap">
            <div class="pm-overall-lbl">${t('pm.task_health')} ${totalTasks} ${t('pm.total_tasks')}</div>
            <div class="pm-bar pm-bar-tall">
              <div class="pm-bar-seg pm-seg-ok"   style="width:${pctOk}%">${pctOk>10?pctOk+'% OK':''}</div>
              <div class="pm-bar-seg pm-seg-attn" style="width:${pctAttn}%">${pctAttn>10?pctAttn+'% ⚠':''}</div>
              <div class="pm-bar-seg pm-seg-na"   style="width:${pctNa}%">${pctNa>10?pctNa+'% N/A':''}</div>
            </div>
          </div>
        ` : `
          <div class="empty">
            <div class="empty-icon">🔧</div>
            ${t('pm.empty')}
            <div style="font-size:11px;margin-top:8px;color:var(--mut2);">${t('pm.empty_hint')}</div>
          </div>
        `}
      </div>
    </div>`;
}

// CHANGEOVER PANEL — surfaces material/production changeover activity
// ═══════════════════════════════════════════════════════════════════════════
function buildChangeoverStats(rows){
  // Each shift report has change_over (Yes/No) plus per-area item flags.
  // Carousel: co_tim_a, co_tim_b, co_pv804, co_bh1, co_bh2, co_mainl, co_1d_label, co_1d_ribbon
  // Potting:  (just change_over)
  // Wave-3:   mco_main_label, mco_1d_label, mco_sealant
  const deduped = dedupShiftRows(rows);
  const out = {
    car: { reports:0, anyCO:0, items:{} },
    pott:{ reports:0, anyCO:0, items:{} },
    wav: { reports:0, anyCO:0, items:{} },
    recent: [],            // recent change-over events for the timeline
    weekly: new Map(),     // weekKey → {reports, anyCO}  for trend computation
  };
  // Item label maps for friendly display
  const carItems = {
    co_tim_a:'TIM A', co_tim_b:'TIM B', co_pv804:'PV 804',
    co_bh1:'BH (1)', co_bh2:'BH (2)', co_mainl:'MainL',
    co_1d_label:'1D Label', co_1d_ribbon:'1D Ribbon',
  };
  const wavItems = {
    mco_main_label:'Main Label', mco_1d_label:'1D Label', mco_sealant:'Sealant',
  };
  const keyMap = {
    'shift-car': {bucket:'car',  items:carItems},
    'shift-pott':{bucket:'pott', items:{}},
    'shift-wav': {bucket:'wav',  items:wavItems},
  };
  deduped.forEach(r => {
    const m = keyMap[r.src.key];
    if(!m) return;
    const b = out[m.bucket];
    b.reports++;
    const yesCO = (r.row.change_over || '').toLowerCase() === 'yes';
    if(yesCO) b.anyCO++;
    const triggeredItems = [];
    Object.entries(m.items).forEach(([field, label]) => {
      if(!b.items[label]) b.items[label] = 0;
      if((r.row[field] || '').toLowerCase() === 'yes'){
        b.items[label]++;
        triggeredItems.push(label);
      }
    });
    if(yesCO || triggeredItems.length > 0){
      out.recent.push({
        when:r.when,
        area: ({car:'Carousel', pott:'Potting', wav:'Wave-3'})[m.bucket],
        line: r.row.line || '?',
        shift: r.row.shift || '?',
        tech: r.row.tech_name || 'Unknown',
        items: triggeredItems,
      });
    }
    // Weekly trend bucketing: derive ISO week start (Monday)
    const t = new Date(r.when);
    if(!isNaN(t.getTime())){
      const day = t.getDay() || 7;        // 1..7, Monday=1
      const monday = new Date(t);
      monday.setDate(t.getDate() - (day - 1));
      monday.setHours(0,0,0,0);
      const weekKey = monday.toISOString().slice(0,10);
      const w = out.weekly.get(weekKey) || {reports:0, anyCO:0};
      w.reports++;
      if(yesCO) w.anyCO++;
      out.weekly.set(weekKey, w);
    }
  });
  out.recent.sort((a,b) => new Date(b.when) - new Date(a.when));
  out.recent = out.recent.slice(0, 8);
  // Compute week-over-week delta on changeover rate (most recent vs prior week)
  const weeks = Array.from(out.weekly.entries()).sort((a,b) => a[0].localeCompare(b[0]));
  out.trend = null;
  if(weeks.length >= 2){
    const prev = weeks[weeks.length - 2][1];
    const curr = weeks[weeks.length - 1][1];
    const prevRate = prev.reports > 0 ? prev.anyCO / prev.reports : 0;
    const currRate = curr.reports > 0 ? curr.anyCO / curr.reports : 0;
    out.trend = {
      curr: Math.round(currRate * 100),
      prev: Math.round(prevRate * 100),
      delta: Math.round((currRate - prevRate) * 100),
      currWeek: weeks[weeks.length - 1][0],
      prevWeek: weeks[weeks.length - 2][0],
    };
  }
  // Sparkline data: last 8 weeks of CO rate %
  out.spark = weeks.slice(-8).map(([k, v]) => ({
    week: k,
    rate: v.reports > 0 ? Math.round((v.anyCO / v.reports) * 100) : 0,
    reports: v.reports,
  }));
  return out;
}

function renderChangeover(s){
  const totalReports = s.car.reports + s.pott.reports + s.wav.reports;
  const totalCO = s.car.anyCO + s.pott.anyCO + s.wav.anyCO;
  const coRate = totalReports > 0 ? Math.round((totalCO/totalReports)*100) : 0;
  const hasData = totalReports > 0;

  const renderArea = (key, label, color) => {
    const a = s[key];
    if(a.reports === 0) return `
      <div class="co-area">
        <div class="co-area-hd"><span class="co-dot" style="background:${color}"></span>${label}</div>
        <div class="co-empty">${t('co.no_in_range')}</div>
      </div>`;
    const rate = Math.round((a.anyCO/a.reports)*100);
    const itemList = Object.entries(a.items)
      .filter(([_,c]) => c > 0)
      .sort((a,b) => b[1] - a[1]);
    return `
      <div class="co-area">
        <div class="co-area-hd">
          <span class="co-dot" style="background:${color}"></span>${label}
          <span class="co-area-rate">${rate}%</span>
        </div>
        <div class="co-area-meta">${a.anyCO} ${t('co.of')} ${a.reports} ${a.reports===1?t('pm.report'):t('pm.reports')} ${t('co.had_changeover')}</div>
        ${itemList.length === 0 && Object.keys(a.items).length === 0
          ? `<div class="co-empty" style="margin-top:6px;">${t('co.no_tracked')}</div>`
          : itemList.length === 0
            ? `<div class="co-empty" style="margin-top:6px;">${t('co.no_triggered')}</div>`
            : `<div class="co-items">${
                itemList.map(([name, n]) => `
                  <div class="co-item">
                    <span class="co-item-name">${escapeHtml(name)}</span>
                    <span class="co-item-bar"><span class="co-item-fill" style="width:${(n/a.reports)*100}%"></span></span>
                    <span class="co-item-count">${n}×</span>
                  </div>`).join('')
              }</div>`
        }
      </div>`;
  };

  const recentHtml = s.recent.length === 0
    ? `<div class="co-empty" style="padding:14px;">${t('co.no_events')}</div>`
    : s.recent.map(e => `
        <div class="co-recent-row">
          <div class="co-recent-when">${relTime(e.when)}</div>
          <div class="co-recent-body">
            <div class="co-recent-where">${escapeHtml(e.area)} · Line ${escapeHtml(e.line)} · Shift ${escapeHtml(e.shift)}</div>
            <div class="co-recent-tech">${escapeHtml(e.tech)}${e.items.length ? ' · ' + e.items.map(escapeHtml).join(', ') : ''}</div>
          </div>
        </div>
      `).join('');

  // Build trend badge (week-over-week delta on changeover rate) + sparkline
  let trendBadge = '';
  let sparkSvg = '';
  if(s.trend){
    const delta = s.trend.delta;
    const arrow = delta > 0 ? '↑' : delta < 0 ? '↓' : '→';
    const cls = delta > 0 ? 'co-trend-up' : delta < 0 ? 'co-trend-down' : 'co-trend-flat';
    const absD = Math.abs(delta);
    trendBadge = `<span class="co-trend ${cls}" title="This week ${s.trend.curr}% vs last week ${s.trend.prev}%">${arrow} ${absD}pp wk/wk</span>`;
  }
  if(s.spark && s.spark.length >= 2){
    const w = 80, h = 22;
    const max = Math.max(1, ...s.spark.map(p => p.rate));
    const stepX = w / (s.spark.length - 1);
    const points = s.spark.map((p, i) => {
      const x = i * stepX;
      const y = h - (p.rate / max) * (h - 4) - 2;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    sparkSvg = `
      <svg viewBox="0 0 ${w} ${h}" class="co-spark" preserveAspectRatio="none"
           title="Last ${s.spark.length} weeks of changeover rate">
        <polyline points="${points}" fill="none" stroke="var(--amb)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
  }

  return `
    <div class="panel" data-panel-key="changeover">
      <div class="panel-head">
        <h2><a class="panel-head-link" href="Analytics_Detail.html?subject=changeover" onclick="event.stopPropagation()" title="Open detail page">${t('analytics.panel.changeover') || 'Material Change'}<span class="panel-head-arrow">→</span></a></h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${renderPanelRangeBadge('changeover')}
          ${hasData ? `<span class="co-badge">${t('co.overall_rate')} ${coRate}% (${totalCO}/${totalReports})</span>` : ''}
          ${trendBadge}
          ${sparkSvg}
        </div>
      </div>
      <div class="panel-body">
        ${hasData ? `
          <div class="co-grid">
            <div class="co-areas">
              ${renderArea('car',  'Carousel', '#a371f7')}
              ${renderArea('pott', 'Potting',  '#3fb950')}
              ${renderArea('wav',  'Wave-3',   '#388bfd')}
            </div>
            <div class="co-recent">
              <div class="co-recent-hd">${t('co.recent')}</div>
              <div class="co-recent-list">${recentHtml}</div>
            </div>
          </div>
        ` : `
          <div class="empty"><div class="empty-icon">🔄</div>${t('co.empty')}</div>
        `}
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// SHIFT PARTICIPATION PANEL — counts shift reports per shift (A/B/C)
// Target: each shift submits 15 reports per period (operational expectation)
// ═══════════════════════════════════════════════════════════════════════════
// Per-shift target scales with the active date range:
//   24hr  → 15 reports/shift (the baseline)
//   7 day → 105 reports/shift
//   30 day → 450, 90 day → 1350, etc.
// For "All time" we fall back to the actual span of the rows in view, so the
// number stays meaningful instead of inflating to absurd values.
const SHIFT_TARGET_PER_DAY = 15;

function getShiftEffectiveDays(rowsInView){
  // Prefer the explicit panel range if set
  const panelDays = getPanelRange('shifts');
  if(panelDays > 0) return panelDays;
  // Else follow the global range
  if(rangeDays && rangeDays !== 'custom' && rangeDays > 0) return rangeDays;
  // Custom range: figure out days between customFrom and customTo
  if(rangeDays === 'custom' && typeof customFrom === 'string' && typeof customTo === 'string'){
    const a = new Date(customFrom).getTime();
    const b = new Date(customTo).getTime();
    if(!isNaN(a) && !isNaN(b) && b > a){
      return Math.max(1, Math.round((b - a) / 86400000));
    }
  }
  // "All time" — use the actual data span. Floor at 1 day so the target isn't 0.
  if(!Array.isArray(rowsInView) || rowsInView.length === 0) return 1;
  let minT = Infinity, maxT = -Infinity;
  rowsInView.forEach(r => {
    const t = new Date(r.when).getTime();
    if(!isNaN(t)){
      if(t < minT) minT = t;
      if(t > maxT) maxT = t;
    }
  });
  if(!isFinite(minT) || !isFinite(maxT)) return 1;
  return Math.max(1, Math.ceil((maxT - minT) / 86400000));
}

function buildShiftStats(rows){
  const deduped = dedupShiftRows(rows);
  const blankAreas = () => ({Carousel:0, Potting:0, 'Wave-3':0, Battery:0, IQ9:0});
  const out = {
    A: {total:0, byArea:blankAreas(), lastSubmit:null},
    B: {total:0, byArea:blankAreas(), lastSubmit:null},
    C: {total:0, byArea:blankAreas(), lastSubmit:null},
    Other: {total:0, byArea:blankAreas(), lastSubmit:null},
  };
  const areaMap = SHIFT_KEY_TO_LABEL;
  deduped.forEach(r => {
    if(r.src.kind !== 'shift') return;
    const area = areaMap[r.src.key];
    if(!area) return;
    const shiftRaw = (r.row.shift || '').trim().toUpperCase();
    const shift = ['A','B','C'].includes(shiftRaw.charAt(0)) ? shiftRaw.charAt(0) : 'Other';
    const bucket = out[shift];
    bucket.total++;
    bucket.byArea[area] = (bucket.byArea[area] || 0) + 1;
    if(!bucket.lastSubmit || new Date(r.when) > new Date(bucket.lastSubmit)){
      bucket.lastSubmit = r.when;
    }
  });
  // Stash the effective days + computed target on the stats object so the
  // renderer can use it without re-querying global state
  const effectiveDays = getShiftEffectiveDays(deduped);
  out.__effectiveDays = effectiveDays;
  out.__targetPerShift = SHIFT_TARGET_PER_DAY * effectiveDays;
  return out;
}

function renderShiftParticipation(stats){
  const SHIFT_TARGET = stats.__targetPerShift;
  const effectiveDays = stats.__effectiveDays;
  const total = stats.A.total + stats.B.total + stats.C.total + stats.Other.total;
  const totalTarget = SHIFT_TARGET * 3;  // target × 3 shifts
  const overallPct = totalTarget > 0 ? Math.round((total/totalTarget)*100) : 0;

  // Friendly description of the scaling logic for the panel-meta line
  const rangeLabel = effectiveDays === 1 ? '24 hr'
                   : effectiveDays === 7 ? '7 days'
                   : effectiveDays === 30 ? '30 days'
                   : effectiveDays === 90 ? '90 days'
                   : `${effectiveDays} days`;
  const targetExplanation = `${SHIFT_TARGET_PER_DAY} reports/shift/day × ${effectiveDays} ${effectiveDays === 1 ? 'day' : 'days'} = ${SHIFT_TARGET}`;

  const renderShiftCard = (key, label, hours) => {
    const s = stats[key];
    const pct = SHIFT_TARGET > 0 ? Math.round((s.total/SHIFT_TARGET)*100) : 0;
    const barWidth = Math.min(100, pct);
    let healthClass = 'shift-low';
    if(pct >= 100) healthClass = 'shift-good';
    else if(pct >= 66) healthClass = 'shift-mid';
    const remaining = Math.max(0, SHIFT_TARGET - s.total);
    return `
      <div class="shift-card ${healthClass}">
        <div class="shift-card-hd">
          <div class="shift-card-label">${label}</div>
          <div class="shift-card-hours">${hours}</div>
        </div>
        <div class="shift-card-num">
          <span class="shift-card-cur">${s.total}</span>
          <span class="shift-card-target">/ ${SHIFT_TARGET}</span>
        </div>
        <div class="shift-card-bar">
          <div class="shift-card-fill" style="width:${barWidth}%"></div>
          ${pct >= 100 ? '<div class="shift-card-overflow">+' + (s.total - SHIFT_TARGET) + '</div>' : ''}
        </div>
        <div class="shift-card-meta">
          ${pct}% · ${remaining > 0 ? `${remaining} ${t('shift.part.more_needed')}` : t('shift.part.target_met')}
        </div>
        <div class="shift-card-areas">
          ${s.byArea.Carousel > 0 ? `<span class="shift-area shift-area-car">${s.byArea.Carousel} car</span>` : ''}
          ${s.byArea.Potting  > 0 ? `<span class="shift-area shift-area-pott">${s.byArea.Potting} pott</span>` : ''}
          ${s.byArea['Wave-3']> 0 ? `<span class="shift-area shift-area-wav">${s.byArea['Wave-3']} wav</span>` : ''}
          ${s.byArea.Battery > 0 ? `<span class="shift-area shift-area-bat">${s.byArea.Battery} bat</span>` : ''}
          ${s.byArea.IQ9 > 0 ? `<span class="shift-area shift-area-iq9">${s.byArea.IQ9} iq9</span>` : ''}
          ${s.total === 0 ? `<span class="shift-area-empty">${t('shift.part.no_reports')}</span>` : ''}
        </div>
      </div>`;
  };

  const otherCard = stats.Other.total > 0 ? `
    <div class="shift-card shift-other">
      <div class="shift-card-hd"><div class="shift-card-label">${t('shift.part.unspec')}</div></div>
      <div class="shift-card-num"><span class="shift-card-cur">${stats.Other.total}</span></div>
      <div class="shift-card-meta">${t('shift.part.no_label')}</div>
    </div>` : '';

  return `
    <div class="panel" data-panel-key="shifts">
      <div class="panel-head">
        <h2><a class="panel-head-link" href="Analytics_Detail.html?subject=shifts" onclick="event.stopPropagation()" title="Open detail page">${t('analytics.panel.shifts') || 'Shift Participation — Reports per Shift'}<span class="panel-head-arrow">→</span></a></h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${renderPanelRangeBadge('shifts')}
          <span class="shift-overall ${overallPct>=100?'shift-overall-good':overallPct>=66?'shift-overall-mid':'shift-overall-low'}">${t('shift.part.overall')} ${overallPct}% (${total}/${totalTarget})</span>
          <span class="panel-meta" title="${targetExplanation}">Target: ${SHIFT_TARGET}/shift over ${rangeLabel}</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="shift-grid">
          ${renderShiftCard('A', t('shift.part.a_label'), t('shift.part.a_hours'))}
          ${renderShiftCard('B', t('shift.part.b_label'), t('shift.part.b_hours'))}
          ${renderShiftCard('C', t('shift.part.c_label'), t('shift.part.c_hours'))}
          ${otherCard}
        </div>
      </div>
    </div>`;
}

function recentFeed(rows){
  const sorted = rows.slice().sort((a,b)=> new Date(b.when) - new Date(a.when));
  return sorted.slice(0,6);
}

// ALERT BANNERS
// Surface real-time conditions (e.g. high flag counts, missed shifts) at the
// top of the dashboard so engineers see them without scrolling.
// Thresholds are configurable per-browser via localStorage.
// Browser Notification API used as bonus when permission granted.
// ──────────────────────────────────────────────────────────────────
const ALERT_KEY = 'salcomp_alert_thresholds';
const ALERT_DEFAULTS = {
  scoutFlagsHigh: 20,    // total scout flags in current view that triggers a banner
  missedShiftsHigh: 0,   // count of A/B/C shifts with zero reports today
  enableNotifications: false,
};
function getAlertConfig(){
  try {
    const raw = localStorage.getItem(ALERT_KEY);
    return raw ? {...ALERT_DEFAULTS, ...JSON.parse(raw)} : {...ALERT_DEFAULTS};
  } catch(e){ return {...ALERT_DEFAULTS}; }
}
function saveAlertConfig(cfg){
  try { localStorage.setItem(ALERT_KEY, JSON.stringify(cfg)); } catch(e){}
}

// Track which alerts we already notified about this session, so a single
// threshold breach doesn't fire a desktop notification on every refresh.
const _notifiedAlerts = new Set();

function renderAlertBanners(rows){
  const cfg = getAlertConfig();
  const alerts = [];

  // Total live scout flags across all scout reports in view
  let totalFlags = 0;
  rows.forEach(r => {
    if(r.src.kind === 'scout') totalFlags += scoutAttnLive(r.row);
  });
  if(totalFlags >= cfg.scoutFlagsHigh && cfg.scoutFlagsHigh > 0){
    alerts.push({
      key: 'flags-' + totalFlags,
      kind: 'warn',
      icon: '⚠',
      msg: `${totalFlags} scout flags in current view — threshold ${cfg.scoutFlagsHigh}.`,
      action: { href: 'Scout_Flags.html', label: 'Review flags →' },
    });
  }

  // Missed shifts today: count A/B/C with zero reports in last 24h
  if(cfg.missedShiftsHigh > 0){
    const cutoff = Date.now() - 86400000;
    const seenShifts = new Set();
    rows.forEach(r => {
      if(r.src.kind !== 'shift') return;
      const t = new Date(r.when).getTime();
      if(isNaN(t) || t < cutoff) return;
      const s = (r.row.shift || '').trim().toUpperCase().charAt(0);
      if('ABC'.includes(s)) seenShifts.add(s);
    });
    const missed = ['A','B','C'].filter(s => !seenShifts.has(s));
    if(missed.length >= cfg.missedShiftsHigh){
      alerts.push({
        key: 'missed-' + missed.join(''),
        kind: 'warn',
        icon: '🔕',
        msg: `${missed.length} shift${missed.length>1?'s':''} with no reports in last 24h: ${missed.join(', ')}.`,
        action: null,
      });
    }
  }

  // Fire desktop notifications for new alerts (only if permission granted)
  if(cfg.enableNotifications && typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    alerts.forEach(a => {
      if(_notifiedAlerts.has(a.key)) return;
      _notifiedAlerts.add(a.key);
      try { new Notification('Salcomp — ' + a.icon, {body: a.msg, icon: 'salcomp-logo.png'}); } catch(e){}
    });
  }

  // Render banner HTML
  if(alerts.length === 0){
    // Show only the small settings cog so users know alerts exist + can configure
    return `<div class="alert-row alert-row-empty">
      <button class="alert-cog" onclick="openAlertConfig()" title="Configure alert thresholds">⚙ Alerts</button>
    </div>`;
  }
  const banners = alerts.map(a => `
    <div class="alert-banner alert-${a.kind}">
      <span class="alert-icon">${a.icon}</span>
      <span class="alert-msg">${escapeHtml(a.msg)}</span>
      ${a.action ? `<a class="alert-action" href="${escapeHtml(a.action.href)}">${escapeHtml(a.action.label)}</a>` : ''}
    </div>`).join('');
  return `<div class="alert-row">${banners}
    <button class="alert-cog" onclick="openAlertConfig()" title="Configure alert thresholds">⚙</button>
  </div>`;
}

window.openAlertConfig = function(){
  const cfg = getAlertConfig();
  // Simple prompt-based config — keeps the binary small
  const flagsTh = prompt('Scout flag threshold (banner appears when total flags ≥ this number; 0 disables):', cfg.scoutFlagsHigh);
  if(flagsTh == null) return;
  const missedTh = prompt('Missed shifts threshold (banner appears when N shifts have zero reports in 24h; 0 disables):', cfg.missedShiftsHigh);
  if(missedTh == null) return;
  const wantNotif = confirm('Enable desktop notifications when alerts fire?\n\nClick OK to enable, Cancel to disable.');
  cfg.scoutFlagsHigh = Math.max(0, parseInt(flagsTh) || 0);
  cfg.missedShiftsHigh = Math.max(0, parseInt(missedTh) || 0);
  cfg.enableNotifications = wantNotif;
  saveAlertConfig(cfg);
  if(wantNotif && typeof Notification !== 'undefined' && Notification.permission !== 'granted'){
    Notification.requestPermission();
  }
  _notifiedAlerts.clear();  // re-evaluate against new thresholds
  render();
};

function render(){
  const allInRange = normalizedRows().filter(r => withinRange(r.when));
  const rowsBeforeDrill = filteredRows();
  const rows = applyDrill(rowsBeforeDrill);
  const allRows = normalizedRows();
  const meta = document.getElementById('rangeMeta');

    meta.innerHTML = `${customFromDate} → ${customToDate} · ${rows.length} of ${allRows.length} reports ${liveBadge}`;
  } else if(rangeDays === 0){
    meta.innerHTML = `All time · ${allRows.length} reports ${liveBadge}`;

    const rangeLbl = rangeDays === 1 ? t('analytics.last24h') : t('analytics.last_days').replace('{n}', rangeDays);

  if(rows.length===0){
    const drillBanner = drillFilter
      ? `<div class="drill-active"><div class="drill-active-text">Drill-down: ${escapeHtml(drillLabel())}</div><button class="drill-active-clear" onclick="clearDrill()">${t('analytics.drill.clear')}</button></div>`
      : '';
    document.getElementById('content').innerHTML = `
      ${drillBanner}
      <div class="empty" style="background:var(--sur);border:1px solid var(--bdr);border-radius:10px;">

      </div>`;

  }

  const k = computeKpis(rows);
  // Each panel computes against its own range-filtered subset

  // Downtime panel uses its own per-panel range from rowsForPanel
  const dtRows    = rowsForPanel('downtime', rows);
  const wipRows   = rowsForPanel('wip', rows);
  const uphRows   = rowsForPanel('uph', rows);
  const scoutRows = rowsForPanel('scout', rows);
  const techRows  = rowsForPanel('techs', rows);

  const pmRows    = rowsForPanel('pm', rows);
  const coRows    = rowsForPanel('changeover', rows);

  const prod = buildProductionSeries(prodRows);
  const dt = buildDowntimeSeries(dtRows);
  const causes = topCauses(dtRows);
  const wip = buildWipBuckets(wipRows, wipLineFilter);
  const uph = buildUphBoard(uphRows);
  const scout = scoutSummary(scoutRows);
  const flags = recentFlags(scoutRows);
  const techs = techCounts(techRows);
  const feed = recentFeed(feedRows);

  // ── 4-TIER ENGINEERING LAYOUT ──────────────────────────────────────────
  // T1 At-a-glance health: KPIs + Shift participation
  // T2 Performance: production trend, UPH heatmap, WIP heatmap, OEE
  // T3 Loss & quality: Pareto, downtime, material change, scout flags
  // T4 Forensics: PM activity, tech leaderboard, recent submissions
  // Each tier is a labeled section; user can pin any panel to a "Pinned" tier
  // shown above all others.
  let panelsHtml = '';
  if(drillFilter){
    panelsHtml += `<div class="drill-active">
      <div class="drill-active-text">${t('analytics.drill.label')} ${escapeHtml(drillLabel())} · ${rows.length} ${t('analytics.drill.matching')}</div>
      <button class="drill-active-clear" onclick="clearDrill()">${t('analytics.drill.clear')}</button>
    </div>`;
  }

  // ── ALERT BANNERS ────────────────────────────────────────────────────
  // Surface conditions engineers want to be told about right now. Configurable
  // thresholds via the gear button on the banner. Stored in localStorage.
  panelsHtml += renderAlertBanners(rows);

  // Build a registry: panel-key → rendered HTML. Lets us pin from any tier.
  const showShiftPanels = (typeFilter === 'all' || typeFilter === 'shift');
  const showScoutPanels = (typeFilter === 'all' || typeFilter === 'scout');
  const showPmPanels    = (typeFilter === 'all' || typeFilter === 'pm');

  const panelRegistry = {};
  panelRegistry.kpis = renderKPIs(k, computeKpisPrevPeriod());
  if(showShiftPanels){
    panelRegistry.shifts     = renderShiftParticipation(buildShiftStats(shiftRows));
    panelRegistry.production = renderProduction(prod);
    panelRegistry.uph        = renderUphBoard(uph);
    panelRegistry.wip        = renderWipBuckets(wip);
    panelRegistry.oee        = renderOee(buildOeeStats(rowsForPanel('oee', rows)));
    panelRegistry.pareto     = renderPareto(buildPareto(rowsForPanel('pareto', rows)));
    panelRegistry.downtime   = renderDowntime(dt, causes);
    panelRegistry.changeover = renderChangeover(buildChangeoverStats(coRows));
  }
  if(showScoutPanels){
    panelRegistry.scout = renderScout(scout, flags);
  }
  if(showPmPanels){
    panelRegistry.pm = renderPmActivity(pmStats(pmRows));
  }
  panelRegistry.techs = renderTechs(techs);
  panelRegistry.feed  = renderFeed(feed);

  // Tier organization. Each entry: [section_label, [panel_keys]]
  const tiers = [
    ['Health',           ['kpis', 'shifts']],
    ['Performance',      ['oee', 'production', 'uph', 'wip']],
    ['Loss & Quality',   ['pareto', 'downtime', 'changeover', 'scout']],
    ['Forensics',        ['pm', 'techs', 'feed']],
  ];

  // Pull pinned panels to a top "Pinned" section (skipping tier section if empty)
  const pinned = getPinnedSet();
  const pinnedKeys = tiers.flatMap(([_, keys]) => keys).filter(k => pinned.has(k) && panelRegistry[k]);
  if(pinnedKeys.length > 0){
    panelsHtml += `<div class="tier-section tier-pinned"><div class="tier-label">📌 Pinned</div>`;
    pinnedKeys.forEach(k => panelsHtml += panelRegistry[k]);
    panelsHtml += `</div>`;
  }

  if(layoutMode === 'flat'){
    // ── FLAT LEGACY LAYOUT ──
    // Render panels in their original linear order without tier wrappers.
    // Skip any panel already shown in the Pinned section.
    const flatOrder = ['kpis','shifts','production','downtime','wip','uph','changeover','scout','pm','techs','feed','oee','pareto'];
    flatOrder.forEach(k => {
      if(panelRegistry[k] && !pinned.has(k)) panelsHtml += panelRegistry[k];
    });
  } else {
    // ── TIERED ENGINEERING LAYOUT ──
    // Render each tier with its label; skip empty tiers (e.g. when typeFilter
    // hides whole groups). Skip panels already shown in Pinned.
    tiers.forEach(([label, keys]) => {
      const tierPanels = keys
        .filter(k => panelRegistry[k] && !pinned.has(k))
        .map(k => panelRegistry[k]).join('');
      if(!tierPanels) return;
      panelsHtml += `
        <div class="tier-section" data-tier="${escapeHtml(label.toLowerCase())}">
          <div class="tier-label">${escapeHtml(label)}</div>
          ${tierPanels}
        </div>`;
    });
  }

  document.getElementById('content').innerHTML = panelsHtml;

  // Inject pin buttons into every panel head (after innerHTML write)
  injectPinButtons();

  // Restore previously collapsed panels
  applyCollapsedState();

  // Now actually draw the SVGs (innerHTML doesn't run scripts)
  if(showShiftPanels){
    drawProductionChart(prod);
    drawDowntimeChart(dt);
  }
  // (no post-render draw needed — buckets are pure HTML)

  // Wire up the WIP line filter pills (re-renders on click)
  const pills = document.getElementById('wipLinePills');
  if(pills){
    pills.addEventListener('click', e => {
      const btn = e.target.closest('.wpill');
      if(!btn) return;
      wipLineFilter = btn.dataset.line;
      render();
    });
  }
}

// ── KPI strip ────────────────────────────────────────────────────────────────
function renderDelta(cur, prev, opts={}){
  if(prev == null) return '';                      // no comparison available
  const lowerIsBetter = !!opts.lowerIsBetter;
  const pct = pctChange(cur, prev);
  if(pct === null) return '<span class="delta delta-flat">— no change</span>';
  if(pct === Infinity) return `<span class="delta ${lowerIsBetter?'delta-down':'delta-up'}">↑ new</span>`;
  const arrow = pct >= 0 ? '↑' : '↓';
  const isUp = pct >= 0;
  // "good" if up && !lowerIsBetter, OR down && lowerIsBetter
  const good = (isUp && !lowerIsBetter) || (!isUp && lowerIsBetter);
  const cls = good ? 'delta-good' : 'delta-bad';
  return `<span class="delta ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}% vs prev</span>`;
}

function renderKPIs(k, kPrev){

// Animate a KPI card's number racing up from 0 to its target with a brief glow
function raceNumber(card){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const valEl = card.querySelector('.kpi-val');
  const target = parseInt(card.dataset.target, 10);
  if(!valEl || isNaN(target)) return;
  // Don't restart mid-animation
  if(card.dataset.racing === '1') return;
  card.dataset.racing = '1';
  card.classList.add('kpi-racing');

  const dur = 900;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now - start) / dur);
    // Quick start, slow finish — ease-out cubic
    const eased = 1 - Math.pow(1 - p, 3);
    const cur = Math.round(target * eased);
    valEl.textContent = cur.toLocaleString();
    if(p < 1){
      requestAnimationFrame(step);
    } else {
      // Snap to final value (in case rounding nudged off by 1)
      valEl.textContent = target.toLocaleString();
      card.dataset.racing = '0';
      card.classList.remove('kpi-racing');
    }
  }
  // Start from 0 for the visual punch
  valEl.textContent = '0';
  requestAnimationFrame(step);
}
